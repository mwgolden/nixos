# Stops and permanently deletes the router VM. VMs on the isolated bridge
# lose their DHCP, DNS and internet access until the router is redeployed.
# The isolated bridge itself is left in place.
# Asks you to type the VM name to confirm.
#
#   source proxmox/.env
#   ansible-playbook hosts/router/destroy.yaml
#
# To skip the prompt (for scripts): -e confirm_destroy=router

- name: Destroy router
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - vars.yaml

  vars_prompt:
    - name: confirm_destroy
      prompt: "This permanently deletes the router VM. Type the VM name to confirm"
      private: false

  tasks:
    - name: Delete the router
      ansible.builtin.include_role:
        name: proxmox_vm_remove
      vars:
        vm_remove_id: "{{ router_vm_id }}"
        vm_remove_name: "{{ router_vm_name }}"
        vm_remove_confirm: "{{ confirm_destroy }}"
        # A future router VM on these IPs gets a new host key.
        vm_remove_known_hosts:
          - "{{ router_ip }}"
