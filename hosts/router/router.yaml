# Clones the NixOS template into the router VM, adds a second network card
# on the isolated bridge, installs the router's NixOS configuration (LAN
# address, DHCP, NAT, firewall) and checks that it works.
# Safe to re-run: an existing router is updated in place.
#
# Create the isolated bridge first (proxmox/scripts/isolated-bridge.yaml).
#
#   source proxmox/.env
#   ansible-playbook hosts/router/router.yaml

- name: Create router VM
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - vars.yaml

  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      validate_certs: "{{ proxmox_validate_certs }}"

  tasks:
    - name: Check required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', item) | length > 0
        fail_msg: "{{ item }} is not set. Run 'source proxmox/.env' first."
        quiet: true
      loop:
        - PROXMOX_TOKEN_SECRET
        - NIXOS_DEPLOYMENT_PUBLIC_KEY
        - NIXOS_DEPLOYMENT_PRIVATE_KEY

    # Checked before anything changes. Whether lan_ip is on the LAN is
    # checked on the router, which knows its own routes.
    - name: Check port forwards
      ansible.builtin.assert:
        that:
          - item.name | default('') is match('^[A-Za-z0-9_-]+$')
          - item.proto | default('') in ['tcp', 'udp']
          - item.wan_port | default('') | string is match('^[0-9]+$')
          - item.wan_port | int >= 1 and item.wan_port | int <= 65535
          - item.lan_port | default(item.wan_port) | string is match('^[0-9]+$')
          - item.lan_port | default(item.wan_port) | int >= 1
          - item.lan_port | default(item.wan_port) | int <= 65535
          - item.lan_ip | default('') is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - not (item.proto == 'tcp' and item.wan_port | int == 22)
        fail_msg: >-
          Port forward {{ item }} is invalid. It needs a name (letters, digits,
          - and _), proto tcp or udp, wan_port and lan_port from 1 to 65535,
          and lan_ip as an IPv4 address. TCP 22 can't be forwarded: it is the
          router's own SSH.
        quiet: true
      loop: "{{ router_port_forwards }}"
      loop_control:
        label: "{{ item.name | default(item) }}"

    - name: Check port forwards don't share a WAN port or name
      ansible.builtin.assert:
        that:
          - wan_ports | unique | length == wan_ports | length
          - names | unique | length == names | length
        fail_msg: >-
          Two port forwards use the same name or the same protocol and WAN
          port: {{ wan_ports }}, {{ names }}.
        quiet: true
      vars:
        wan_ports: >-
          {{ router_port_forwards | map(attribute='proto')
             | zip(router_port_forwards | map(attribute='wan_port') | map('int'))
             | map('join', '/') | list }}
        names: "{{ router_port_forwards | map(attribute='name') | list }}"

    - name: Look up the isolated bridge
      community.proxmox.proxmox_node_network_info:
        node: "{{ proxmox_node }}"
        iface: "{{ isolated_bridge }}"
      register: bridge_info

    - name: Require the isolated bridge
      ansible.builtin.assert:
        that:
          - bridge_info.proxmox_node_networks | length == 1
        fail_msg: >-
          {{ isolated_bridge }} does not exist on {{ proxmox_node }}.
          Run proxmox/scripts/isolated-bridge.yaml first.
        quiet: true

    # Proxmox leaves out "active" when the bridge is not up in the kernel.
    - name: Require the isolated bridge to be up
      ansible.builtin.assert:
        that:
          - bridge_info.proxmox_node_networks[0].get('active', false) | bool
        fail_msg: >-
          {{ isolated_bridge }} is configured on {{ proxmox_node }} but is not
          up. On the node, check 'ip link show {{ isolated_bridge }}' and run
          'ifreload -a'.
        quiet: true

    - name: Look up VMs on the node
      community.proxmox.proxmox_vm_info:
        node: "{{ proxmox_node }}"
        type: qemu
      register: node_vms

    - name: Find existing router VM
      ansible.builtin.set_fact:
        existing_vm: >-
          {{ node_vms.proxmox_vms
             | selectattr('vmid', 'equalto', router_vm_id | int)
             | first | default(none) }}

    - name: Make sure the VM ID belongs to the router
      ansible.builtin.assert:
        that:
          - existing_vm.name == router_vm_name
        fail_msg: >-
          VM {{ router_vm_id }} exists but is named '{{ existing_vm.name }}',
          not '{{ router_vm_name }}'. Refusing to configure it.
      when: existing_vm is not none

    - name: Clone router from NixOS template
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ template_vm_id }}"
        clone: "{{ template_vm_name }}"
        newid: "{{ router_vm_id }}"
        name: "{{ router_vm_name }}"
        full: "{{ router_full_clone }}"
        format: "{{ omit if router_full_clone else 'unspecified' }}"
        timeout: 300
      when: existing_vm is none

    # net0 (ens18, WAN) comes from the template. net1 shows up in the VM as
    # ens19, the LAN interface in configuration.nix.
    - name: Add LAN network card on the isolated bridge
      community.proxmox.proxmox_nic:
        vmid: "{{ router_vm_id }}"
        interface: net1
        model: virtio
        bridge: "{{ isolated_bridge }}"

    # A new clone has the template's host key, which may differ from the key
    # recorded for this IP by a previous router.
    - name: Forget old SSH host key for the router IP
      ansible.builtin.known_hosts:
        name: "{{ router_ip }}"
        state: absent
      when: existing_vm is none

    - name: Start router
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ router_vm_id }}"
        state: started

    # An existing router is normally on its own IP already. One left over
    # from an interrupted run may still be on the template IP.
    - name: Check whether the router is on its own IP
      ansible.builtin.wait_for:
        host: "{{ router_ip }}"
        port: 22
        timeout: 60
      register: on_router_ip
      ignore_errors: true
      when: existing_vm is not none

    - name: Choose the address to connect to
      ansible.builtin.set_fact:
        connect_ip: >-
          {{ router_ip
             if existing_vm is not none and on_router_ip is succeeded
             else template_ip }}

    - name: Wait for router SSH
      ansible.builtin.wait_for:
        host: "{{ connect_ip }}"
        port: 22
        delay: 5
        timeout: 300

    - name: Add router to inventory
      ansible.builtin.add_host:
        name: router
        ansible_host: "{{ connect_ip }}"
        ansible_user: admin
        ansible_ssh_private_key_file: "{{ lookup('env', 'NIXOS_DEPLOYMENT_PRIVATE_KEY') }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
        changes_ip: "{{ connect_ip != router_ip }}"

- name: Configure router
  hosts: router
  gather_facts: false
  become: true
  vars_files:
    - ../../proxmox/vars.yaml
    - vars.yaml

  tasks:
    - name: Wait for login
      ansible.builtin.wait_for_connection:
        timeout: 120

    # configuration.nix expects the LAN card as ens19. Stop here rather than
    # switch to a configuration that puts the LAN address on nothing.
    - name: Check the LAN interface exists
      ansible.builtin.stat:
        path: /sys/class/net/ens19
      register: lan_interface

    - name: Require the LAN interface
      ansible.builtin.assert:
        that:
          - lan_interface.stat.exists
        fail_msg: >-
          The router has no ens19 interface. Check that net1 on VM
          {{ router_vm_id }} is attached to {{ isolated_bridge }}, and see
          'ip link' on the router for the name it got.
        quiet: true

    # Expected output: "10.1.0.10 dev ens19 src 10.1.0.1 ...". Anything else
    # means the address is the router itself or not on the isolated LAN.
    - name: Look up where each port forward points
      ansible.builtin.command:
        cmd: ip -4 route get {{ item.lan_ip }}
      register: forward_routes
      changed_when: false
      loop: "{{ router_port_forwards }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Require port forwards to point at the isolated LAN
      ansible.builtin.assert:
        that:
          - item.stdout is match('^' ~ (item.item.lan_ip | regex_escape) ~ ' dev ens19 ')
        fail_msg: >-
          Port forward '{{ item.item.name }}' points at {{ item.item.lan_ip }},
          which is not a VM on the isolated LAN
          ({{ router_lan_ip }}/{{ router_lan_prefix_length }}, not the router
          itself). Route: {{ item.stdout }}
        quiet: true
      loop: "{{ forward_routes.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # Rendering fills in the deployment SSH public key.
    - name: Install common NixOS configuration
      ansible.builtin.template:
        src: ../../modules/common.nix
        dest: /etc/nixos/common.nix
        mode: "0644"

    - name: Install network configuration
      ansible.builtin.template:
        src: ../../modules/network.nix.j2
        dest: /etc/nixos/network.nix
        mode: "0644"
      vars:
        host_name: "{{ router_vm_name }}"
        host_ip: "{{ router_ip }}"

    - name: Install router settings
      ansible.builtin.template:
        src: router-vars.nix.j2
        dest: /etc/nixos/router-vars.nix
        mode: "0644"

    - name: Install router NixOS configuration
      ansible.builtin.copy:
        src: configuration.nix
        dest: /etc/nixos/configuration.nix
        mode: "0644"

    # Building first downloads everything and shows any errors here, so the
    # switch below is quick and unlikely to fail.
    - name: Build NixOS configuration
      ansible.builtin.command:
        cmd: nixos-rebuild build
        chdir: /tmp
      changed_when: false

    - name: Remove build result link
      ansible.builtin.file:
        path: /tmp/result
        state: absent

    - name: Switch to NixOS configuration
      ansible.builtin.command:
        cmd: nixos-rebuild switch
      when: not (changes_ip | bool)

    # Moving to the new IP drops this SSH connection, so start the switch in
    # the background and reconnect on the new IP.
    - name: Switch to NixOS configuration and move to the router IP
      ansible.builtin.command:
        cmd: nixos-rebuild switch
      async: 300
      poll: 0
      register: switch_job
      when: changes_ip | bool

    - name: Wait for SSH on the router IP
      ansible.builtin.wait_for:
        host: "{{ router_ip }}"
        port: 22
        delay: 5
        timeout: 300
      delegate_to: localhost
      become: false

    - name: Connect to the router IP from now on
      ansible.builtin.set_fact:
        ansible_host: "{{ router_ip }}"

    - name: Reset the SSH connection
      ansible.builtin.meta: reset_connection

    - name: Wait for login on the router IP
      ansible.builtin.wait_for_connection:
        timeout: 120

    # The WAN address changes early in the switch, so SSH answers on the new
    # IP while the rest (forwarding, NAT, firewall) is still being applied.
    # The job keeps running on the router after the old connection drops.
    - name: Wait for the switch to finish
      ansible.builtin.async_status:
        jid: "{{ switch_job.ansible_job_id }}"
      register: switch_result
      until: switch_result.finished
      retries: 60
      delay: 5
      when: changes_ip | bool

    # A live switch doesn't start this unit the first time: it is only
    # pulled in when ens19 appears, and ens19 has been there since boot.
    # (A reboot would start it too.) Already running, this does nothing.
    - name: Put the LAN address on ens19
      ansible.builtin.systemd_service:
        name: network-addresses-ens19.service
        state: started

    # The LAN can't be reached from here, so check the router's side of it.
    - name: Check the LAN address
      ansible.builtin.command:
        cmd: ip -4 -br addr show dev ens19
      register: lan_address
      changed_when: false
      failed_when: (router_lan_ip ~ '/' ~ router_lan_prefix_length) not in lan_address.stdout

    - name: Check IPv4 forwarding is on
      ansible.builtin.command:
        cmd: sysctl -n net.ipv4.ip_forward
      register: ip_forward
      changed_when: false
      failed_when: ip_forward.stdout | trim != '1'

    - name: Check dnsmasq (DHCP and DNS) is running
      ansible.builtin.command:
        cmd: systemctl is-active dnsmasq
      changed_when: false

    - name: Check the forward rules block private networks
      ansible.builtin.command:
        cmd: nft list chain inet nixos-fw forward-allow
      register: forward_rules
      changed_when: false
      failed_when: "'LAN may not reach private networks' not in forward_rules.stdout"

    - name: Read the port forward rules
      ansible.builtin.command:
        cmd: nft list chain ip nixos-nat pre
      register: nat_rules
      changed_when: false
      when: router_port_forwards | length > 0

    # nft prints each forward as "tcp . 80 : 10.1.0.10 . 80".
    - name: Check each port forward is in place
      ansible.builtin.assert:
        that:
          - expected in nat_rules.stdout
        fail_msg: "Port forward '{{ item.name }}' ({{ expected }}) is missing from the NAT rules."
        quiet: true
      vars:
        expected: >-
          {{ item.proto }} . {{ item.wan_port | int }} : {{ item.lan_ip }} .
          {{ item.lan_port | default(item.wan_port) | int }}
      loop: "{{ router_port_forwards }}"
      loop_control:
        label: "{{ item.name }}"

    # Uses TCP rather than ping: the home network drops outbound ping.
    # These are the servers dnsmasq forwards LAN clients' DNS queries to.
    - name: Check the router reaches the upstream DNS servers
      ansible.builtin.wait_for:
        host: "{{ item }}"
        port: 53
        timeout: 10
      loop: "{{ router_dns_servers }}"

- name: Report router status
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - vars.yaml

  tasks:
    - name: Show router details
      ansible.builtin.debug:
        msg: >-
          The router is up on {{ router_ip }} (WAN). VMs attached to
          {{ isolated_bridge }} get an address from {{ router_dhcp_range_start }}
          to {{ router_dhcp_range_end }} with gateway and DNS
          {{ router_lan_ip }}.
