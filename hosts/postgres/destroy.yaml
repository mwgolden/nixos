# Stops and permanently deletes the postgres VM, including its data disk
# and every database on it.
# Asks you to type the VM name to confirm.
#
#   source proxmox/.env
#   ansible-playbook hosts/postgres/destroy.yaml
#
# To skip the prompt (for scripts): -e confirm_destroy=postgres

- name: Destroy postgres VM
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - vars.yaml

  vars_prompt:
    - name: confirm_destroy
      prompt: "This permanently deletes the postgres VM, its data disk and all databases. Type the VM name to confirm"
      private: false

  tasks:
    - name: Delete the postgres VM
      ansible.builtin.include_role:
        name: proxmox_vm_remove
      vars:
        vm_remove_id: "{{ postgres_vm_id }}"
        vm_remove_name: "{{ postgres_vm_name }}"
        vm_remove_confirm: "{{ confirm_destroy }}"
        # A future postgres VM on these IPs gets a new host key.
        vm_remove_known_hosts:
          - "{{ postgres_ip }}"
          - "{{ postgres_isolated_ip }}"
