# Clones the NixOS template into the postgres VM, adds and formats a data
# disk, installs PostgreSQL, sets the admin login from .env and optionally
# loads the AdventureWorks sample database.
# Safe to re-run: an existing VM is updated in place.
#
# postgres_network in vars.yaml puts it on the home network or on the
# router's isolated network. Changing it and re-running moves the VM.
#
#   source proxmox/.env
#   ansible-playbook hosts/postgres/postgres.yaml

- name: Create postgres VM
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      validate_certs: "{{ proxmox_validate_certs }}"

  tasks:
    - name: Read the database admin login from hosts/postgres/.env
      ansible.builtin.include_role:
        name: dotenv
      vars:
        dotenv_path: "{{ playbook_dir }}/.env"
        dotenv_missing_hint: "Copy .env.example to .env and set the admin login."

    - name: Note the database admin login
      ansible.builtin.set_fact:
        postgres_admin_user: "{{ dotenv_values.POSTGRES_ADMIN_USER | default('') }}"
        postgres_admin_password: "{{ dotenv_values.POSTGRES_ADMIN_PASSWORD | default('') }}"
      no_log: true

    - name: Check database admin login
      ansible.builtin.assert:
        that:
          - postgres_admin_user is match('^[a-z_][a-z0-9_]*$')
          - postgres_admin_password | length > 0
        fail_msg: >-
          Set POSTGRES_ADMIN_USER (lowercase letters, digits, underscores) and
          POSTGRES_ADMIN_PASSWORD in hosts/postgres/.env.
        quiet: true

    - name: Create or update the postgres VM
      ansible.builtin.include_role:
        name: proxmox_vm
      vars:
        proxmox_vm_id: "{{ postgres_vm_id }}"
        proxmox_vm_name: "{{ postgres_vm_name }}"
        proxmox_vm_full_clone: "{{ postgres_full_clone }}"
        proxmox_vm_data_disk:
          serial: postgres-data
          size_gb: "{{ postgres_data_disk_gb }}"
          storage: "{{ postgres_data_disk_storage }}"
          setting: postgres_data_disk_gb in hosts/postgres/vars.yaml

    - name: Find the postgres VM and connect to it
      ansible.builtin.include_role:
        name: nixos_base
        tasks_from: placement
      vars:
        place_alias: postgres
        place_vm_id: "{{ postgres_vm_id }}"
        place_vm_name: "{{ postgres_vm_name }}"
        place_home_ip: "{{ postgres_ip }}"
        place_isolated_ip: "{{ postgres_isolated_ip }}"
        place_network: "{{ postgres_network }}"
        place_new_clone: "{{ proxmox_vm_new_clone }}"
        place_net0: "{{ '' if proxmox_vm_new_clone else proxmox_vm_existing.config.get('net0', '') }}"

- name: Configure postgres VM
  hosts: postgres
  gather_facts: false
  become: true
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  vars:
    data_disk_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_postgres-data"
    postgres_admin_user: "{{ hostvars['localhost'].postgres_admin_user }}"
    postgres_admin_password: "{{ hostvars['localhost'].postgres_admin_password }}"
    adventureworks_src: /var/lib/adventureworks-src

  tasks:
    - name: Install the shared NixOS configuration
      ansible.builtin.include_role:
        name: nixos_base
      vars:
        nixos_base_hostname: "{{ postgres_vm_name }}"
        nixos_base_data_disk_serial: postgres-data

    - name: Install PostgreSQL settings
      ansible.builtin.template:
        src: postgres.nix.j2
        dest: /etc/nixos/postgres.nix
        mode: "0644"

    - name: Install postgres NixOS configuration
      ansible.builtin.copy:
        src: configuration.nix
        dest: /etc/nixos/configuration.nix
        mode: "0644"

    - name: Switch to the configuration and move to the postgres address
      ansible.builtin.include_role:
        name: nixos_base
        tasks_from: switch

    - name: Check the data disk is mounted
      ansible.builtin.command:
        cmd: findmnt --source {{ data_disk_device }} --target /var/lib/postgresql
      changed_when: false

    - name: Wait for PostgreSQL
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ postgres_port }}"
        timeout: 120

    # Creates the role if needed and always sets its password, so a changed
    # password in .env is applied on the next run.
    - name: Set database admin login
      ansible.builtin.command:
        cmd: runuser -u postgres -- psql -v ON_ERROR_STOP=1 -q -p {{ postgres_port }} -d postgres
        stdin: |
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ postgres_admin_user }}') THEN
              CREATE ROLE "{{ postgres_admin_user }}";
            END IF;
          END
          $$;
          ALTER ROLE "{{ postgres_admin_user }}" WITH LOGIN SUPERUSER PASSWORD '{{ postgres_admin_password | replace("'", "''") }}';
      no_log: true
      changed_when: false

    - name: Load AdventureWorks
      when: adventureworks_enabled | bool
      block:
        - name: Check whether the AdventureWorks database exists
          ansible.builtin.command:
            cmd: >-
              runuser -u postgres -- psql -tA -p {{ postgres_port }} -d postgres
              -c "SELECT 1 FROM pg_database WHERE datname = '{{ adventureworks_database }}'"
          register: adventureworks_exists
          changed_when: false

        - name: Create and populate the AdventureWorks database
          when: adventureworks_exists.stdout != '1'
          block:
            - name: Download AdventureWorks
              ansible.builtin.git:
                repo: "{{ adventureworks_repo }}"
                dest: "{{ adventureworks_src }}"
                version: "{{ adventureworks_version }}"
                force: true

            # Some \copy lines in install.sql use 'X.csv' instead of
            # './data/X.csv'. Linking the CSVs next to it makes both work.
            - name: Link CSV files next to install.sql
              ansible.builtin.shell:
                cmd: ln -sf data/*.csv .
                chdir: "{{ adventureworks_src }}"
              changed_when: true

            - name: Create the AdventureWorks database
              ansible.builtin.command:
                cmd: >-
                  runuser -u postgres -- createdb -p {{ postgres_port }}
                  --owner "{{ postgres_admin_user }}" "{{ adventureworks_database }}"

            - name: Import AdventureWorks (takes a few minutes)
              ansible.builtin.command:
                cmd: >-
                  runuser -u postgres -- psql -v ON_ERROR_STOP=1 -q
                  -p {{ postgres_port }} -d "{{ adventureworks_database }}" -f install.sql
                chdir: "{{ adventureworks_src }}"

          # A half-loaded database would be skipped on the next run, so
          # remove it and let the next run start over.
          rescue:
            - name: Remove the partly loaded database
              ansible.builtin.command:
                cmd: >-
                  runuser -u postgres -- dropdb -p {{ postgres_port }}
                  --if-exists "{{ adventureworks_database }}"

            - name: Report the failed import
              ansible.builtin.fail:
                msg: "Loading AdventureWorks failed; see the error above. The partly loaded database was removed."

          always:
            - name: Remove AdventureWorks download
              ansible.builtin.file:
                path: "{{ adventureworks_src }}"
                state: absent

- name: Check PostgreSQL
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  vars:
    final: "{{ hostvars['postgres'].final }}"

  tasks:
    # On the isolated network only the router can reach postgres, so the
    # check runs there.
    - name: Check PostgreSQL accepts connections
      ansible.builtin.wait_for:
        host: "{{ final.ip }}"
        port: "{{ postgres_port }}"
        timeout: 60
      delegate_to: "{{ 'router' if final.via_router else 'localhost' }}"

    - name: Show connection details
      ansible.builtin.debug:
        msg: >-
          {% if final.via_router -%}
          PostgreSQL is up on the isolated network at {{ final.ip }}:{{ postgres_port }}.
          VMs on the isolated LAN connect there. To reach it from home, add a
          port forward in hosts/router/vars.yaml (proto tcp, lan_ip {{ final.ip }},
          lan_port {{ postgres_port }}) and run hosts/router/port-forwards.yaml,
          then connect to the router: psql -h {{ router_ip }} -p <wan_port>
          -U {{ postgres_admin_user }} -d postgres
          {%- else -%}
          PostgreSQL is up. Connect with:
          psql -h {{ final.ip }} -p {{ postgres_port }} -U {{ postgres_admin_user }} -d postgres
          {%- endif %}
          (password in hosts/postgres/.env)
