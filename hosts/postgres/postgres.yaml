- name: Create postgresql VM
  hosts: localhost
  gather_facts: false

  vars: 
    template_name: "nixos-template"
    target_ip: "192.168.1.13"
    template_ip: "192.168.1.10"
    proxmox_api_host: "proxmox.home.lan"
    proxmox_node: "com"
    proxmox_api_user: "ansible@pve"
    proxmox_api_token_id: "automation"
    source_vm_id: 110

    postgres_vmid: 112

    data_disk:
      serial: "postgres-data"
      device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_postgres-data"
      partition: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_postgres-data-part1"

  tasks: 
    - name: Clone webserver from NixOS template
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET')}}"
        node: "{{ proxmox_node }}"
        clone: "{{ template_name }}"
        vmid: "{{ source_vm_id }}"
        newid: 112
        name: postgres
        format: unspecified
        full: false
        timeout: 300
        validate_certs: false
      delegate_to: localhost

    - name: Add a data disk to VM for data
      community.proxmox.proxmox_disk:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET')}}"
        vmid: "{{ postgres_vmid }}"
        disk: scsi1
        serial: postgres-data
        size: 8
        storage: local-lvm
        state: present
        validate_certs: false
      delegate_to: localhost

    - name: Start postgres vm
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_api_token_id }}"
        api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET')}}"
        node: "{{ proxmox_node }}"
        name: postgres
        state: started
        validate_certs: false
      delegate_to: localhost
    
    - name: Add postgres vm to inventory
      ansible.builtin.add_host:
        name: postgres
        ansible_host: "{{ template_ip }}"
        ansible_user: admin
        ansible_ssh_private_key_file: "{{ lookup('env', 'NIXOS_DEPLOYMENT_PRIVATE_KEY') }}"
    
    - name: Wait for postgres SSH
      ansible.builtin.wait_for:
        host: "{{ template_ip }}"
        port: 22
        delay: 5
        timeout: 300
        state: started
      delegate_to: localhost

    - name: Check data disk
      ansible.builtin.stat:
        path: "{{ data_disk.device }}"
      register: data_disk_device
      delegate_to: postgres

    - name: Verify data disk exists
      ansible.builtin.assert:
        that:
          - data_disk_device.stat.exists
          - data_disk_device.stat.islnk
        fail_msg: "Postgresql data disk was not found: {{ data_disk.device }}"

    # Partition Disk
    - name: Partition PostgreSQL data disk
      ansible.builtin.command:
        cmd: >
          nix-shell -p parted e2fsprogs --run
          'parted --script /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_postgres-data
          mklabel gpt
          mkpart primary ext4 1MiB 100%
          && mkfs.ext4 /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_postgres-data-part1'
      delegate_to: postgres
      become: true

    - name: Get PostgreSQL data filesystem UUID
      ansible.builtin.command:
        cmd: blkid -s UUID -o value /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_postgres-data-part1
      register: postgres_data_uuid
      changed_when: false
      delegate_to: postgres
      become: true

    