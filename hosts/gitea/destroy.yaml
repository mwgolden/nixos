# Stops and permanently deletes the gitea VM, including its data disk
# and every repository on it.
# Asks you to type the VM name to confirm.
#
#   source proxmox/.env
#   ansible-playbook hosts/gitea/destroy.yaml
#
# To skip the prompt (for scripts): -e confirm_destroy=gitea

- name: Destroy gitea VM
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - vars.yaml

  vars_prompt:
    - name: confirm_destroy
      prompt: "This permanently deletes the gitea VM, its data disk and all repositories. Type the VM name to confirm"
      private: false

  tasks:
    - name: Delete the gitea VM
      ansible.builtin.include_role:
        name: proxmox_vm_remove
      vars:
        vm_remove_id: "{{ gitea_vm_id }}"
        vm_remove_name: "{{ gitea_vm_name }}"
        vm_remove_confirm: "{{ confirm_destroy }}"
        # A future gitea VM on these IPs gets a new host key.
        vm_remove_known_hosts:
          - "{{ gitea_ip }}"
          - "{{ gitea_isolated_ip }}"
