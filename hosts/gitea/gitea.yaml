# Clones the NixOS template into the gitea VM, adds and formats a data disk,
# installs Gitea and sets the admin login from .env.
# Safe to re-run: an existing VM is updated in place.
#
# gitea_network in vars.yaml puts it on the home network or on the router's
# isolated network. Changing it and re-running moves the VM.
#
#   source proxmox/.env
#   ansible-playbook hosts/gitea/gitea.yaml

- name: Create gitea VM
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      validate_certs: "{{ proxmox_validate_certs }}"

  tasks:
    - name: Check required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', item) | length > 0
        fail_msg: "{{ item }} is not set. Run 'source proxmox/.env' first."
        quiet: true
      loop:
        - PROXMOX_TOKEN_SECRET
        - NIXOS_DEPLOYMENT_PUBLIC_KEY
        - NIXOS_DEPLOYMENT_PRIVATE_KEY

    - name: Check for hosts/gitea/.env
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/.env"
      register: gitea_env_file

    - name: Require hosts/gitea/.env
      ansible.builtin.assert:
        that:
          - gitea_env_file.stat.exists
        fail_msg: "{{ playbook_dir }}/.env is missing. Copy .env.example to .env and set the admin login."
        quiet: true

    # Reads KEY=value lines; "export " and surrounding quotes are optional.
    - name: Read Gitea admin login from .env
      ansible.builtin.set_fact:
        gitea_admin_user: "{{ gitea_env.GITEA_ADMIN_USER | default('') | regex_replace('^([\"\\x27]?)(.*)\\1$', '\\2') }}"
        gitea_admin_password: "{{ gitea_env.GITEA_ADMIN_PASSWORD | default('') | regex_replace('^([\"\\x27]?)(.*)\\1$', '\\2') }}"
        gitea_admin_email: "{{ gitea_env.GITEA_ADMIN_EMAIL | default('') | regex_replace('^([\"\\x27]?)(.*)\\1$', '\\2') }}"
      vars:
        gitea_env: >-
          {{ dict(lookup('file', playbook_dir ~ '/.env')
                  | regex_findall('(?m)^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)=(.*?)\s*$')) }}
      no_log: true

    - name: Check Gitea admin login
      ansible.builtin.assert:
        that:
          - gitea_admin_user is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
          - gitea_admin_user | lower != 'admin'
          - gitea_admin_password | length >= 8
          - gitea_admin_email is match('^[^@\s]+@[^@\s]+$')
        fail_msg: >-
          In hosts/gitea/.env, set GITEA_ADMIN_USER (letters, digits, '-', '_'
          and '.', not "admin", which Gitea reserves), GITEA_ADMIN_PASSWORD
          (at least 8 characters) and GITEA_ADMIN_EMAIL.
        quiet: true

    - name: Look up gitea VM
      community.proxmox.proxmox_vm_info:
        node: "{{ proxmox_node }}"
        vmid: "{{ gitea_vm_id }}"
        config: current
      register: gitea_vm_info

    - name: Note whether the VM exists
      ansible.builtin.set_fact:
        existing_vm: "{{ gitea_vm_info.proxmox_vms | first | default(none) }}"

    - name: Make sure the VM ID belongs to the gitea VM
      ansible.builtin.assert:
        that:
          - existing_vm.name == gitea_vm_name
        fail_msg: >-
          VM {{ gitea_vm_id }} exists but is named '{{ existing_vm.name }}',
          not '{{ gitea_vm_name }}'. Refusing to configure it.
      when: existing_vm is not none

    - name: Clone gitea VM from NixOS template
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ template_vm_id }}"
        clone: "{{ template_vm_name }}"
        newid: "{{ gitea_vm_id }}"
        name: "{{ gitea_vm_name }}"
        full: "{{ gitea_full_clone }}"
        format: "{{ omit if gitea_full_clone else 'unspecified' }}"
        timeout: 300
      when: existing_vm is none

    # scsi1 looks like "local-lvm:vm-114-disk-1,serial=gitea-data,size=40G".
    - name: Read current data disk size
      ansible.builtin.set_fact:
        data_disk_config: "{{ existing_vm.config.scsi1 | default('') if existing_vm is not none else '' }}"

    - name: Parse current data disk size
      ansible.builtin.set_fact:
        data_disk_current_gb: "{{ ((data_disk_config | regex_search('size=(\\d+)G', '\\1')) or ['0']) | first | int }}"

    - name: Refuse to shrink the data disk
      ansible.builtin.assert:
        that:
          - gitea_data_disk_gb | int >= data_disk_current_gb | int
        fail_msg: >-
          The data disk is {{ data_disk_current_gb }} GB and can't be shrunk to
          {{ gitea_data_disk_gb }} GB. Set gitea_data_disk_gb to at least
          {{ data_disk_current_gb }} in vars.yaml.
      when: data_disk_config | length > 0

    - name: Add data disk
      community.proxmox.proxmox_disk:
        vmid: "{{ gitea_vm_id }}"
        disk: scsi1
        serial: gitea-data
        size: "{{ gitea_data_disk_gb }}"
        storage: "{{ gitea_data_disk_storage }}"
        state: present
      when: data_disk_config | length == 0

    - name: Grow data disk
      community.proxmox.proxmox_disk:
        vmid: "{{ gitea_vm_id }}"
        disk: scsi1
        size: "{{ gitea_data_disk_gb }}G"
        state: resized
        timeout: 120
      when:
        - data_disk_config | length > 0
        - gitea_data_disk_gb | int > data_disk_current_gb | int

    - name: Start gitea VM
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ gitea_vm_id }}"
        state: started

    - name: Find the gitea VM and connect to it
      ansible.builtin.include_tasks: ../../modules/ansible/placement.yaml
      vars:
        place_alias: gitea
        place_vm_id: "{{ gitea_vm_id }}"
        place_vm_name: "{{ gitea_vm_name }}"
        place_home_ip: "{{ gitea_ip }}"
        place_isolated_ip: "{{ gitea_isolated_ip }}"
        place_network: "{{ gitea_network }}"
        place_new_clone: "{{ existing_vm is none }}"
        place_net0: "{{ existing_vm.config.get('net0', '') if existing_vm is not none else '' }}"

- name: Configure gitea VM
  hosts: gitea
  gather_facts: false
  become: true
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  vars:
    data_disk_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_gitea-data"
    gitea_admin_user: "{{ hostvars['localhost'].gitea_admin_user }}"
    gitea_admin_password: "{{ hostvars['localhost'].gitea_admin_password }}"
    gitea_admin_email: "{{ hostvars['localhost'].gitea_admin_email }}"
    # Used in links and clone URLs; see gitea_public_* in vars.yaml.
    gitea_url_host: "{{ gitea_public_host or final.ip }}"
    gitea_url_http_port: "{{ gitea_public_http_port or gitea_http_port }}"
    gitea_url_ssh_port: "{{ gitea_public_ssh_port or 22 }}"
    # Runs the gitea command as the gitea user against the live settings.
    gitea_cli: >-
      runuser -u gitea -- env GITEA_WORK_DIR=/var/lib/gitea
      GITEA_CUSTOM=/var/lib/gitea/custom gitea

  tasks:
    - name: Wait for login
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Wait for the data disk to appear
      ansible.builtin.wait_for:
        path: "{{ data_disk_device }}"
        timeout: 60

    # Only formats a disk with no filesystem, so existing data is never
    # wiped. On a disk that was grown, it grows the filesystem to match.
    - name: Format data disk
      community.general.filesystem:
        dev: "{{ data_disk_device }}"
        fstype: ext4
        resizefs: true

    # Rendering fills in the deployment SSH public key.
    - name: Install common NixOS configuration
      ansible.builtin.template:
        src: ../../modules/common.nix
        dest: /etc/nixos/common.nix
        mode: "0644"

    - name: Install network configuration
      ansible.builtin.template:
        src: ../../modules/network.nix.j2
        dest: /etc/nixos/network.nix
        mode: "0644"
      vars:
        host_name: "{{ gitea_vm_name }}"
        host_ip: "{{ final.ip }}"
        host_prefix_length: "{{ final.prefix_length }}"
        host_gateway: "{{ final.gateway }}"
        host_nameserver: "{{ final.nameserver }}"

    - name: Install Gitea settings
      ansible.builtin.template:
        src: gitea.nix.j2
        dest: /etc/nixos/gitea.nix
        mode: "0644"

    - name: Install gitea NixOS configuration
      ansible.builtin.copy:
        src: configuration.nix
        dest: /etc/nixos/configuration.nix
        mode: "0644"

    - name: Switch to the configuration and move to the gitea address
      ansible.builtin.include_tasks: ../../modules/ansible/switch.yaml

    - name: Check the data disk is mounted
      ansible.builtin.command:
        cmd: findmnt --source {{ data_disk_device }} --target /var/lib/gitea
      changed_when: false

    - name: Wait for Gitea
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ gitea_http_port }}"
        timeout: 120

    # Rows look like "1   gitadmin   gitadmin@example.com   true   true   false".
    - name: List Gitea users
      ansible.builtin.command:
        cmd: "{{ gitea_cli }} admin user list"
        chdir: /var/lib/gitea
      register: gitea_users
      changed_when: false

    - name: List Gitea admins
      ansible.builtin.command:
        cmd: "{{ gitea_cli }} admin user list --admin"
        chdir: /var/lib/gitea
      register: gitea_admins
      changed_when: false

    - name: Note which users exist
      ansible.builtin.set_fact:
        gitea_user_names: "{{ gitea_users.stdout | regex_findall('(?m)^\\d+\\s+(\\S+)') | map('lower') | list }}"
        gitea_admin_names: "{{ gitea_admins.stdout | regex_findall('(?m)^\\d+\\s+(\\S+)') | map('lower') | list }}"

    - name: Require the admin login to be an admin
      ansible.builtin.assert:
        that:
          - gitea_admin_user | lower not in gitea_user_names or gitea_admin_user | lower in gitea_admin_names
        fail_msg: >-
          Gitea already has a user named '{{ gitea_admin_user }}' who isn't an
          admin. Make them an admin in Site Administration, or pick another
          GITEA_ADMIN_USER in hosts/gitea/.env.
        quiet: true

    - name: Create the Gitea admin user
      ansible.builtin.command:
        cmd: >-
          {{ gitea_cli }} admin user create --admin
          --username {{ gitea_admin_user | quote }}
          --password {{ gitea_admin_password | quote }}
          --email {{ gitea_admin_email | quote }}
          --must-change-password=false
        chdir: /var/lib/gitea
      when: gitea_admin_user | lower not in gitea_user_names
      no_log: true

    # Always sets the password, so a changed password in .env is applied on
    # the next run.
    - name: Set the Gitea admin password
      ansible.builtin.command:
        cmd: >-
          {{ gitea_cli }} admin user change-password
          --username {{ gitea_admin_user | quote }}
          --password {{ gitea_admin_password | quote }}
          --must-change-password=false
        chdir: /var/lib/gitea
      when: gitea_admin_user | lower in gitea_user_names
      no_log: true
      changed_when: false

# On the isolated network only the router can reach Gitea, so the check
# runs there.
- name: Check Gitea
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  vars:
    final: "{{ hostvars['gitea'].final }}"
    gitea_url: >-
      http://{{ gitea_public_host or final.ip }}:{{ gitea_public_http_port or gitea_http_port }}/

  tasks:
    - name: Check Gitea answers
      ansible.builtin.uri:
        url: "http://{{ final.ip }}:{{ gitea_http_port }}/api/healthz"
        status_code: 200
      register: gitea_check
      retries: 10
      delay: 3
      until: gitea_check is succeeded
      delegate_to: "{{ 'router' if final.via_router else 'localhost' }}"

    - name: Show where Gitea is
      ansible.builtin.debug:
        msg: >-
          {% if final.via_router and not gitea_public_host -%}
          Gitea is up on the isolated network at http://{{ final.ip }}:{{ gitea_http_port }}/.
          To reach it from home, add port forwards in hosts/router/vars.yaml
          (lan_ip {{ final.ip }}, lan_port {{ gitea_http_port }} for the web
          and 22 for git over SSH, on a wan_port other than 22), run
          hosts/router/port-forwards.yaml, then set gitea_public_host and the
          gitea_public_*_port settings in hosts/gitea/vars.yaml and re-run.
          {%- else -%}
          Gitea is up at {{ gitea_url | trim }}. Log in as
          {{ hostvars['localhost'].gitea_admin_user }} (password in hosts/gitea/.env).
          {%- endif %}
