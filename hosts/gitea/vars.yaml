# Settings for the gitea VM. Shared Proxmox and network settings
# (API host, node, template, gateway) come from proxmox/vars.yaml.
# The Gitea admin login is in .env (see .env.example).

gitea_vm_id: 114
gitea_vm_name: "gitea"
gitea_ip: "192.168.1.14"

# Which network the VM is on:
#   home      on vmbr0 at gitea_ip, reachable from the home network
#   isolated  on the router's isolated LAN at gitea_isolated_ip. It can
#             reach the internet but not the home network, and is reached
#             from home only through router port forwards. Deploy the router
#             first.
# Changing this and re-running gitea.yaml moves the VM, or use
# hosts/move-network.yaml -e host=gitea -e network=isolated.
gitea_network: "home"

# Fixed address on the isolated LAN, outside the router's DHCP range.
gitea_isolated_ip: "10.1.0.14"

# A linked clone is fast and small, but Proxmox will not delete the template
# while it exists (bootstrap.sh --force fails). Set true for a full copy.
gitea_full_clone: false

# Separate disk for everything Gitea keeps: repositories, LFS files,
# attachments, the database and settings. Mounted at /var/lib/gitea.
# Raise it and re-run the playbook to grow the disk. It can't be shrunk.
gitea_data_disk_gb: 40
gitea_data_disk_storage: "local-lvm"

# Port the web interface listens on. Git over SSH uses the VM's SSH on 22.
gitea_http_port: 3000

# The address people use to reach Gitea, shown in links and clone URLs.
# Left empty, they are the VM's own address, gitea_http_port and 22. On the
# isolated network, set them to the router's address and the forwarded
# ports, for example "192.168.1.13", 3000 and 2222.
gitea_public_host: ""
gitea_public_http_port: ""
gitea_public_ssh_port: ""

# Let anyone who can reach Gitea create an account. When false, only the
# admin can add users.
gitea_allow_registration: false
