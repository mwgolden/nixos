# Moves a deployed VM between the home network and the router's isolated
# network, without redeploying it.
#
#   source proxmox/.env
#   ansible-playbook hosts/move-network.yaml -e host=webserver -e network=isolated
#   ansible-playbook hosts/move-network.yaml -e host=webserver -e network=home
#
# host is a folder under hosts/ (webserver, postgres, gitea) whose vars.yaml sets
# <host>_vm_id, <host>_vm_name, <host>_ip, <host>_isolated_ip and
# <host>_network. Only the VM's network.nix changes; the rest of its
# configuration stays as deployed. Moving to the isolated network needs the
# router deployed.
#
# Afterwards, <host>_network in hosts/<host>/vars.yaml is set to the new
# network, so the host's deploy playbook keeps the VM where it is.

- name: Find the VM to move
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../proxmox/vars.yaml
    - router/vars.yaml

  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      validate_certs: "{{ proxmox_validate_certs }}"

  tasks:
    - name: Check the arguments
      ansible.builtin.assert:
        that:
          - host is defined
          - host is match('^[a-z0-9_-]+$')
          - host != 'router'
          - network | default('') in ['home', 'isolated']
        fail_msg: >-
          Run with -e host=<name of a folder under hosts/> -e network=home or
          -e network=isolated. The router itself can't be moved.
        quiet: true

    - name: Check required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', item) | length > 0
        fail_msg: "{{ item }} is not set. Run 'source proxmox/.env' first."
        quiet: true
      loop:
        - PROXMOX_TOKEN_SECRET
        - NIXOS_DEPLOYMENT_PRIVATE_KEY

    - name: Check for the host's settings
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/{{ host }}/vars.yaml"
      register: host_vars_file

    - name: Require the host's settings
      ansible.builtin.assert:
        that:
          - host_vars_file.stat.exists
        fail_msg: "{{ playbook_dir }}/{{ host }}/vars.yaml doesn't exist."
        quiet: true

    - name: Read the host's settings
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/{{ host }}/vars.yaml"

    - name: Require the network settings
      ansible.builtin.assert:
        that:
          - lookup('vars', host ~ '_' ~ item, default='') | string | length > 0
        fail_msg: >-
          {{ host }}_{{ item }} is not set in hosts/{{ host }}/vars.yaml. Only
          hosts with {{ host }}_network and {{ host }}_isolated_ip can be moved.
        quiet: true
      loop: [vm_id, vm_name, ip, isolated_ip, network]

    - name: Collect the host's settings
      ansible.builtin.set_fact:
        move_vm_id: "{{ lookup('vars', host ~ '_vm_id') }}"
        move_vm_name: "{{ lookup('vars', host ~ '_vm_name') }}"
        move_home_ip: "{{ lookup('vars', host ~ '_ip') }}"
        move_isolated_ip: "{{ lookup('vars', host ~ '_isolated_ip') }}"

    - name: Look up the VM
      community.proxmox.proxmox_vm_info:
        node: "{{ proxmox_node }}"
        vmid: "{{ move_vm_id }}"
        config: current
      register: move_vm_info

    - name: Note the VM
      ansible.builtin.set_fact:
        existing_vm: "{{ move_vm_info.proxmox_vms | first | default(none) }}"

    - name: Require the VM to be deployed
      ansible.builtin.assert:
        that:
          - existing_vm is not none
          - existing_vm.name == move_vm_name
        fail_msg: >-
          VM {{ move_vm_id }} ({{ move_vm_name }}) doesn't exist, or has another
          name. Deploy it with hosts/{{ host }}/{{ host }}.yaml instead; that
          puts it on {{ host }}_network from vars.yaml.
        quiet: true

    - name: Start the VM
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ move_vm_id }}"
        state: started

    - name: Find the VM and connect to it
      ansible.builtin.include_tasks: ../modules/ansible/placement.yaml
      vars:
        place_alias: "{{ host }}"
        place_vm_id: "{{ move_vm_id }}"
        place_vm_name: "{{ move_vm_name }}"
        place_home_ip: "{{ move_home_ip }}"
        place_isolated_ip: "{{ move_isolated_ip }}"
        place_network: "{{ network }}"
        place_new_clone: false
        place_net0: "{{ existing_vm.config.get('net0', '') }}"

- name: Move the VM
  hosts: "{{ host }}"
  gather_facts: false
  become: true
  vars_files:
    - ../proxmox/vars.yaml

  tasks:
    - name: Wait for login
      ansible.builtin.wait_for_connection:
        timeout: 120

    # The rest of /etc/nixos comes from the host's deploy playbook, and only
    # network.nix is replaced here.
    - name: Check the VM was deployed by this repo
      ansible.builtin.stat:
        path: /etc/nixos/network.nix
      register: network_nix

    - name: Require a deployed configuration
      ansible.builtin.assert:
        that:
          - network_nix.stat.exists
        fail_msg: >-
          /etc/nixos/network.nix is missing on the VM. Deploy it with
          hosts/{{ host }}/{{ host }}.yaml instead.
        quiet: true

    - name: Install network configuration for the {{ network }} network
      ansible.builtin.template:
        src: ../modules/network.nix.j2
        dest: /etc/nixos/network.nix
        mode: "0644"
      vars:
        host_name: "{{ hostvars['localhost'].move_vm_name }}"
        host_ip: "{{ final.ip }}"
        host_prefix_length: "{{ final.prefix_length }}"
        host_gateway: "{{ final.gateway }}"
        host_nameserver: "{{ final.nameserver }}"

    - name: Switch to the configuration and move the VM
      ansible.builtin.include_tasks: ../modules/ansible/switch.yaml

    - name: Check the VM's address
      ansible.builtin.command:
        cmd: ip -4 -br addr show dev ens18
      register: ens18_address
      changed_when: false
      failed_when: (final.ip ~ '/') not in ens18_address.stdout

- name: Record the move
  hosts: localhost
  gather_facts: false

  vars:
    final: "{{ hostvars[host].final }}"

  tasks:
    # So the host's deploy playbook keeps the VM on this network.
    - name: Set {{ host }}_network in hosts/{{ host }}/vars.yaml
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/{{ host }}/vars.yaml"
        regexp: '^{{ host }}_network:'
        line: '{{ host }}_network: "{{ network }}"'

    - name: Show where the VM is
      ansible.builtin.debug:
        msg: >-
          {{ host }} is on the {{ network }} network at {{ final.ip }}.
          {% if network == 'isolated' -%}
          It can reach the internet but not the home network. To reach one of
          its services from home, add a port forward to {{ final.ip }} in
          hosts/router/vars.yaml and run hosts/router/port-forwards.yaml.
          {%- endif %}
