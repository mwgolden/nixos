# Stops and permanently deletes the garage VM, including its data disk
# and every object stored on it.
# Asks you to type the VM name to confirm.
#
#   source proxmox/.env
#   ansible-playbook hosts/garage/destroy.yaml
#
# To skip the prompt (for scripts): -e confirm_destroy=garage

- name: Destroy garage VM
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - vars.yaml

  vars_prompt:
    - name: confirm_destroy
      prompt: "This permanently deletes the garage VM, its data disk and all stored objects. Type the VM name to confirm"
      private: false

  tasks:
    - name: Delete the garage VM
      ansible.builtin.include_role:
        name: proxmox_vm_remove
      vars:
        vm_remove_id: "{{ garage_vm_id }}"
        vm_remove_name: "{{ garage_vm_name }}"
        vm_remove_confirm: "{{ confirm_destroy }}"
        # A future garage VM on these IPs gets a new host key.
        vm_remove_known_hosts:
          - "{{ garage_ip }}"
          - "{{ garage_isolated_ip }}"
