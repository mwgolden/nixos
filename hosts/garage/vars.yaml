# Settings for the garage VM. Shared Proxmox and network settings
# (API host, node, template, gateway) come from proxmox/vars.yaml.
# The S3 access key is in .env (see .env.example).

garage_vm_id: 115
garage_vm_name: "garage"
garage_ip: "192.168.1.15"

# Which network the VM is on:
#   home      on vmbr0 at garage_ip, reachable from the home network
#   isolated  on the router's isolated LAN at garage_isolated_ip. It can
#             reach the internet but not the home network, and is reached
#             from home only through router port forwards. Deploy the router
#             first.
# Changing this and re-running garage.yaml moves the VM, or use
# hosts/move-network.yaml -e host=garage -e network=isolated.
garage_network: "home"

# Fixed address on the isolated LAN, outside the router's DHCP range.
garage_isolated_ip: "10.1.0.15"

# A linked clone is fast and small, but Proxmox will not delete the template
# while it exists (bootstrap.sh --force fails). Set true for a full copy.
garage_full_clone: false

# Separate disk for everything Garage keeps: objects, metadata and the
# cluster secret. Mounted at /var/lib/garage.
# Raise it and re-run the playbook to grow the disk. It can't be shrunk.
garage_data_disk_gb: 128
garage_data_disk_storage: "local-lvm"

# Port the S3 API listens on.
garage_s3_port: 3900

# Region name S3 clients must use. Garage accepts only this one.
garage_s3_region: "garage"

# Zone name for this node in Garage's cluster layout. With a single node it
# is only a label.
garage_zone: "dc1"

# Name shown in Garage for the access key from .env. The key can create
# buckets, and gets read, write and owner rights on garage_buckets.
garage_key_name: "default"

# Buckets the playbook creates. Names follow S3 rules: 3 to 63 lowercase
# letters, digits, '-' and '.'. Removing a name here doesn't delete the
# bucket. For example:
#   garage_buckets:
#     - backups
#     - media
garage_buckets: []
