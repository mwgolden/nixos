# Clones the NixOS template into the garage VM, adds and formats a data disk,
# installs Garage (S3-compatible object storage), sets up its storage
# layout, and adds the access key from .env and the buckets from vars.yaml.
# Safe to re-run: an existing VM is updated in place.
#
# garage_network in vars.yaml puts it on the home network or on the router's
# isolated network. Changing it and re-running moves the VM.
#
#   source proxmox/.env
#   ansible-playbook hosts/garage/garage.yaml

- name: Create garage VM
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      validate_certs: "{{ proxmox_validate_certs }}"

  tasks:
    - name: Check required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', item) | length > 0
        fail_msg: "{{ item }} is not set. Run 'source proxmox/.env' first."
        quiet: true
      loop:
        - PROXMOX_TOKEN_SECRET
        - NIXOS_DEPLOYMENT_PUBLIC_KEY
        - NIXOS_DEPLOYMENT_PRIVATE_KEY

    - name: Check for hosts/garage/.env
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/.env"
      register: garage_env_file

    - name: Require hosts/garage/.env
      ansible.builtin.assert:
        that:
          - garage_env_file.stat.exists
        fail_msg: "{{ playbook_dir }}/.env is missing. Copy .env.example to .env and set the access key."
        quiet: true

    # Reads KEY=value lines; "export " and surrounding quotes are optional.
    - name: Read the access key from .env
      ansible.builtin.set_fact:
        garage_key_id: "{{ garage_env.GARAGE_ACCESS_KEY_ID | default('') | regex_replace('^([\"\\x27]?)(.*)\\1$', '\\2') }}"
        garage_key_secret: "{{ garage_env.GARAGE_SECRET_ACCESS_KEY | default('') | regex_replace('^([\"\\x27]?)(.*)\\1$', '\\2') }}"
      vars:
        garage_env: >-
          {{ dict(lookup('file', playbook_dir ~ '/.env')
                  | regex_findall('(?m)^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)=(.*?)\s*$')) }}
      no_log: true

    - name: Check the access key
      ansible.builtin.assert:
        that:
          - garage_key_id is match('^GK[0-9a-f]{24}$')
          - garage_key_secret is match('^[0-9a-f]{64}$')
          - garage_key_id != 'GK000000000000000000000000'
        fail_msg: >-
          In hosts/garage/.env, set GARAGE_ACCESS_KEY_ID to "GK" and 24 hex
          digits and GARAGE_SECRET_ACCESS_KEY to 64 hex digits. .env.example
          shows how to generate them.
        quiet: true

    - name: Check bucket names
      ansible.builtin.assert:
        that:
          - item is string
          - item is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$')
        fail_msg: >-
          '{{ item }}' in garage_buckets isn't a valid bucket name. Use 3 to 63
          lowercase letters, digits, '-' and '.', starting and ending with a
          letter or digit.
        quiet: true
      loop: "{{ garage_buckets }}"

    - name: Look up garage VM
      community.proxmox.proxmox_vm_info:
        node: "{{ proxmox_node }}"
        vmid: "{{ garage_vm_id }}"
        config: current
      register: garage_vm_info

    - name: Note whether the VM exists
      ansible.builtin.set_fact:
        existing_vm: "{{ garage_vm_info.proxmox_vms | first | default(none) }}"

    - name: Make sure the VM ID belongs to the garage VM
      ansible.builtin.assert:
        that:
          - existing_vm.name == garage_vm_name
        fail_msg: >-
          VM {{ garage_vm_id }} exists but is named '{{ existing_vm.name }}',
          not '{{ garage_vm_name }}'. Refusing to configure it.
      when: existing_vm is not none

    - name: Clone garage VM from NixOS template
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ template_vm_id }}"
        clone: "{{ template_vm_name }}"
        newid: "{{ garage_vm_id }}"
        name: "{{ garage_vm_name }}"
        full: "{{ garage_full_clone }}"
        format: "{{ omit if garage_full_clone else 'unspecified' }}"
        timeout: 300
      when: existing_vm is none

    # scsi1 looks like "local-lvm:vm-115-disk-1,serial=garage-data,size=128G".
    - name: Read current data disk size
      ansible.builtin.set_fact:
        data_disk_config: "{{ existing_vm.config.scsi1 | default('') if existing_vm is not none else '' }}"

    - name: Parse current data disk size
      ansible.builtin.set_fact:
        data_disk_current_gb: "{{ ((data_disk_config | regex_search('size=(\\d+)G', '\\1')) or ['0']) | first | int }}"

    - name: Refuse to shrink the data disk
      ansible.builtin.assert:
        that:
          - garage_data_disk_gb | int >= data_disk_current_gb | int
        fail_msg: >-
          The data disk is {{ data_disk_current_gb }} GB and can't be shrunk to
          {{ garage_data_disk_gb }} GB. Set garage_data_disk_gb to at least
          {{ data_disk_current_gb }} in vars.yaml.
      when: data_disk_config | length > 0

    - name: Add data disk
      community.proxmox.proxmox_disk:
        vmid: "{{ garage_vm_id }}"
        disk: scsi1
        serial: garage-data
        size: "{{ garage_data_disk_gb }}"
        storage: "{{ garage_data_disk_storage }}"
        state: present
      when: data_disk_config | length == 0

    - name: Grow data disk
      community.proxmox.proxmox_disk:
        vmid: "{{ garage_vm_id }}"
        disk: scsi1
        size: "{{ garage_data_disk_gb }}G"
        state: resized
        timeout: 120
      when:
        - data_disk_config | length > 0
        - garage_data_disk_gb | int > data_disk_current_gb | int

    - name: Start garage VM
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ garage_vm_id }}"
        state: started

    - name: Find the garage VM and connect to it
      ansible.builtin.include_tasks: ../../modules/ansible/placement.yaml
      vars:
        place_alias: garage
        place_vm_id: "{{ garage_vm_id }}"
        place_vm_name: "{{ garage_vm_name }}"
        place_home_ip: "{{ garage_ip }}"
        place_isolated_ip: "{{ garage_isolated_ip }}"
        place_network: "{{ garage_network }}"
        place_new_clone: "{{ existing_vm is none }}"
        place_net0: "{{ existing_vm.config.get('net0', '') if existing_vm is not none else '' }}"

- name: Configure garage VM
  hosts: garage
  gather_facts: false
  become: true
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  vars:
    data_disk_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_garage-data"
    garage_key_id: "{{ hostvars['localhost'].garage_key_id }}"
    garage_key_secret: "{{ hostvars['localhost'].garage_key_secret }}"
    # Layout capacity in bytes: the data disk's size in decimal GB, a little
    # under its real size, so Garage doesn't plan on more than the disk holds.
    garage_capacity: "{{ garage_data_disk_gb | int * 1000000000 }}"
    # Calls Garage's admin API through the garage command, which talks to the
    # server over RPC. The JSON payload goes on stdin and the reply is JSON.
    garage_api: "garage json-api"

  tasks:
    - name: Wait for login
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Wait for the data disk to appear
      ansible.builtin.wait_for:
        path: "{{ data_disk_device }}"
        timeout: 60

    # Only formats a disk with no filesystem, so existing data is never
    # wiped. On a disk that was grown, it grows the filesystem to match.
    - name: Format data disk
      community.general.filesystem:
        dev: "{{ data_disk_device }}"
        fstype: ext4
        resizefs: true

    # Rendering fills in the deployment SSH public key.
    - name: Install common NixOS configuration
      ansible.builtin.template:
        src: ../../modules/common.nix
        dest: /etc/nixos/common.nix
        mode: "0644"

    - name: Install network configuration
      ansible.builtin.template:
        src: ../../modules/network.nix.j2
        dest: /etc/nixos/network.nix
        mode: "0644"
      vars:
        host_name: "{{ garage_vm_name }}"
        host_ip: "{{ final.ip }}"
        host_prefix_length: "{{ final.prefix_length }}"
        host_gateway: "{{ final.gateway }}"
        host_nameserver: "{{ final.nameserver }}"

    - name: Install Garage settings
      ansible.builtin.template:
        src: garage.nix.j2
        dest: /etc/nixos/garage.nix
        mode: "0644"

    - name: Install garage NixOS configuration
      ansible.builtin.copy:
        src: configuration.nix
        dest: /etc/nixos/configuration.nix
        mode: "0644"

    - name: Switch to the configuration and move to the garage address
      ansible.builtin.include_tasks: ../../modules/ansible/switch.yaml

    - name: Check the data disk is mounted
      ansible.builtin.command:
        cmd: findmnt --source {{ data_disk_device }} --target /var/lib/garage
      changed_when: false

    # ---- Storage layout ----
    # Garage stores nothing until its node has a role in the cluster layout.

    - name: Wait for Garage
      ansible.builtin.command:
        cmd: "{{ garage_api }} GetClusterStatus"
      register: garage_status
      retries: 20
      delay: 3
      until: garage_status is succeeded
      changed_when: false

    - name: Read the cluster layout
      ansible.builtin.command:
        cmd: "{{ garage_api }} GetClusterLayout"
      register: garage_layout_result
      changed_when: false

    # A single node, so the only node in the status is this one.
    - name: Note this node's role
      ansible.builtin.set_fact:
        garage_node_id: "{{ node.id }}"
        garage_layout: "{{ layout }}"
        garage_role: "{{ layout.roles | selectattr('id', 'equalto', node.id) | first | default(none) }}"
      vars:
        node: "{{ (garage_status.stdout | from_json).nodes | first }}"
        layout: "{{ garage_layout_result.stdout | from_json }}"

    - name: Give this node its storage role
      when: >-
        garage_role is none
        or garage_role.zone != garage_zone
        or (garage_role.capacity | default(0) | int) != (garage_capacity | int)
      block:
        - name: Stage the storage role
          ansible.builtin.command:
            cmd: "{{ garage_api }} UpdateClusterLayout -"
            stdin: "{{ {'roles': [{'id': garage_node_id, 'zone': garage_zone, 'capacity': garage_capacity | int, 'tags': []}]} | to_json }}"

        - name: Apply the new layout
          ansible.builtin.command:
            cmd: "{{ garage_api }} ApplyClusterLayout -"
            stdin: "{{ {'version': garage_layout.version | int + 1} | to_json }}"

    - name: Wait for Garage to be healthy
      ansible.builtin.command:
        cmd: "{{ garage_api }} GetClusterHealth"
      register: garage_health
      retries: 20
      delay: 3
      until: >-
        garage_health is succeeded
        and (garage_health.stdout | from_json).status == 'healthy'
      changed_when: false

    # ---- Access key ----

    - name: List access keys
      ansible.builtin.command:
        cmd: "{{ garage_api }} ListKeys"
      register: garage_keys
      changed_when: false

    - name: Import the access key from .env
      ansible.builtin.command:
        cmd: "{{ garage_api }} ImportKey -"
        stdin: "{{ {'accessKeyId': garage_key_id, 'secretAccessKey': garage_key_secret, 'name': garage_key_name} | to_json }}"
      when: garage_key_id not in (garage_keys.stdout | from_json | map(attribute='id') | list)
      no_log: true

    - name: Read the access key
      ansible.builtin.command:
        cmd: "{{ garage_api }} GetKeyInfo -"
        stdin: "{{ {'id': garage_key_id, 'showSecretKey': true} | to_json }}"
      register: garage_key_result
      changed_when: false
      no_log: true

    - name: Note the access key
      ansible.builtin.set_fact:
        garage_key: "{{ garage_key_result.stdout | from_json }}"
      no_log: true

    # Garage can't change a key's secret. Replacing it means deleting the key
    # and importing it again, which also drops its bucket rights.
    - name: Require the secret in .env to match Garage's
      ansible.builtin.assert:
        that:
          - garage_key.secretAccessKey == garage_key_secret
        fail_msg: >-
          Garage already has key {{ garage_key_id }} with a different secret
          than GARAGE_SECRET_ACCESS_KEY in hosts/garage/.env. Put the old
          secret back, or delete the key on the VM
          (sudo garage key delete --yes {{ garage_key_id }}) and re-run.
        quiet: true
      no_log: true

    - name: Let the access key create buckets and set its name
      ansible.builtin.command:
        cmd: "{{ garage_api }} UpdateKey -"
        stdin: "{{ {'id': garage_key_id, 'body': {'name': garage_key_name, 'allow': {'createBucket': true}}} | to_json }}"
      when: >-
        garage_key.name != garage_key_name
        or not garage_key.permissions.createBucket | default(false)

    # ---- Buckets ----

    - name: List buckets
      ansible.builtin.command:
        cmd: "{{ garage_api }} ListBuckets"
      register: garage_bucket_list
      changed_when: false

    - name: Create buckets
      ansible.builtin.command:
        cmd: "{{ garage_api }} CreateBucket -"
        stdin: "{{ {'globalAlias': item} | to_json }}"
      loop: "{{ garage_buckets }}"
      when: item not in (garage_bucket_list.stdout | from_json | map(attribute='globalAliases') | flatten | list)

    - name: Read buckets
      ansible.builtin.command:
        cmd: "{{ garage_api }} GetBucketInfo -"
        stdin: "{{ {'globalAlias': item} | to_json }}"
      loop: "{{ garage_buckets }}"
      register: garage_bucket_info
      changed_when: false

    - name: Give the access key full rights on the buckets
      ansible.builtin.command:
        cmd: "{{ garage_api }} AllowBucketKey -"
        stdin: "{{ {'bucketId': bucket.id, 'accessKeyId': garage_key_id, 'permissions': {'read': true, 'write': true, 'owner': true}} | to_json }}"
      loop: "{{ garage_bucket_info.results }}"
      loop_control:
        label: "{{ item.item }}"
      vars:
        bucket: "{{ item.stdout | from_json }}"
        perms: >-
          {{ (bucket.get('keys', []) | selectattr('accessKeyId', 'equalto', garage_key_id)
              | map(attribute='permissions') | first | default({})) }}
      when: not (perms.read | default(false) and perms.write | default(false) and perms.owner | default(false))

# On the isolated network only the router can reach Garage, so the check
# runs there.
- name: Check Garage
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  vars:
    final: "{{ hostvars['garage'].final }}"
    garage_endpoint: "http://{{ final.ip }}:{{ garage_s3_port }}"

  tasks:
    # Garage turns away unsigned requests with 403, which shows the S3 API
    # is up without needing the key.
    - name: Check the S3 API answers
      ansible.builtin.uri:
        url: "{{ garage_endpoint }}/"
        status_code: 403
      register: garage_check
      retries: 10
      delay: 3
      until: garage_check is succeeded
      delegate_to: "{{ 'router' if final.via_router else 'localhost' }}"

    - name: Show where Garage is
      ansible.builtin.debug:
        msg: >-
          {% if final.via_router -%}
          Garage is up on the isolated network at {{ garage_endpoint }}.
          To reach it from home, add a port forward in hosts/router/vars.yaml
          (lan_ip {{ final.ip }}, lan_port {{ garage_s3_port }}) and run
          hosts/router/port-forwards.yaml. S3 clients then use
          http://{{ router_ip }}:<wan_port>.
          {%- else -%}
          Garage is up. S3 clients use endpoint {{ garage_endpoint }},
          region {{ garage_s3_region }}, path-style addressing, and access key
          {{ garage_key_id }} (secret in hosts/garage/.env).
          {%- endif %}
