# Settings for the webserver VM. Shared Proxmox and network settings
# (API host, node, template, gateway) come from proxmox/vars.yaml.

webserver_vm_id: 111
webserver_vm_name: "webserver"
webserver_ip: "192.168.1.11"

# A linked clone is fast and small, but Proxmox will not delete the template
# while it exists (bootstrap.sh --force fails). Set true for a full copy.
webserver_full_clone: false

# Which network the webserver is on:
#   home      on vmbr0 at webserver_ip, reachable from the home network
#   isolated  on the router's isolated LAN at webserver_isolated_ip. It can
#             reach the internet but not the home network, and is reached
#             from home only through router port forwards. Deploy the router
#             first.
# Changing this and re-running webserver.yaml moves the VM, or use
# hosts/move-network.yaml -e host=webserver -e network=isolated.
webserver_network: "home"

# Fixed address on the isolated LAN, outside the router's DHCP range.
webserver_isolated_ip: "10.1.0.11"
