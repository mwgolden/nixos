# Stops and permanently deletes the webserver VM, including its disk.
# Asks you to type the VM name to confirm.
#
#   source proxmox/.env
#   ansible-playbook hosts/webserver/destroy.yaml
#
# To skip the prompt (for scripts): -e confirm_destroy=webserver

- name: Destroy webserver VM
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - vars.yaml

  vars_prompt:
    - name: confirm_destroy
      prompt: "This permanently deletes the webserver VM and its disk. Type the VM name to confirm"
      private: false

  tasks:
    - name: Delete the webserver VM
      ansible.builtin.include_role:
        name: proxmox_vm_remove
      vars:
        vm_remove_id: "{{ webserver_vm_id }}"
        vm_remove_name: "{{ webserver_vm_name }}"
        vm_remove_confirm: "{{ confirm_destroy }}"
        # A future webserver VM on these IPs gets a new host key.
        vm_remove_known_hosts:
          - "{{ webserver_ip }}"
          - "{{ webserver_isolated_ip }}"
