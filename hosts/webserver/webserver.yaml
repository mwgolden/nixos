# Clones the NixOS template into the webserver VM, installs its NixOS
# configuration and site files, and checks that it serves HTTP.
# Safe to re-run: an existing webserver is updated in place.
#
# webserver_network in vars.yaml puts it on the home network or on the
# router's isolated network. Changing it and re-running moves the VM.
#
#   source proxmox/.env
#   ansible-playbook hosts/webserver/webserver.yaml

- name: Create webserver VM
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      validate_certs: "{{ proxmox_validate_certs }}"

  tasks:
    - name: Check required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', item) | length > 0
        fail_msg: "{{ item }} is not set. Run 'source proxmox/.env' first."
        quiet: true
      loop:
        - PROXMOX_TOKEN_SECRET
        - NIXOS_DEPLOYMENT_PUBLIC_KEY
        - NIXOS_DEPLOYMENT_PRIVATE_KEY

    - name: Look up webserver VM
      community.proxmox.proxmox_vm_info:
        node: "{{ proxmox_node }}"
        vmid: "{{ webserver_vm_id }}"
        config: current
      register: webserver_vm_info

    - name: Note whether the VM exists
      ansible.builtin.set_fact:
        existing_vm: "{{ webserver_vm_info.proxmox_vms | first | default(none) }}"

    - name: Make sure the VM ID belongs to the webserver
      ansible.builtin.assert:
        that:
          - existing_vm.name == webserver_vm_name
        fail_msg: >-
          VM {{ webserver_vm_id }} exists but is named '{{ existing_vm.name }}',
          not '{{ webserver_vm_name }}'. Refusing to configure it.
      when: existing_vm is not none

    - name: Clone webserver from NixOS template
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ template_vm_id }}"
        clone: "{{ template_vm_name }}"
        newid: "{{ webserver_vm_id }}"
        name: "{{ webserver_vm_name }}"
        full: "{{ webserver_full_clone }}"
        format: "{{ omit if webserver_full_clone else 'unspecified' }}"
        timeout: 300
      when: existing_vm is none

    - name: Start webserver
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ webserver_vm_id }}"
        state: started

    - name: Find the webserver and connect to it
      ansible.builtin.include_tasks: ../../modules/ansible/placement.yaml
      vars:
        place_alias: webserver
        place_vm_id: "{{ webserver_vm_id }}"
        place_vm_name: "{{ webserver_vm_name }}"
        place_home_ip: "{{ webserver_ip }}"
        place_isolated_ip: "{{ webserver_isolated_ip }}"
        place_network: "{{ webserver_network }}"
        place_new_clone: "{{ existing_vm is none }}"
        place_net0: "{{ existing_vm.config.get('net0', '') if existing_vm is not none else '' }}"

- name: Configure webserver
  hosts: webserver
  gather_facts: false
  become: true
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  tasks:
    - name: Wait for login
      ansible.builtin.wait_for_connection:
        timeout: 120

    # Rendering fills in the deployment SSH public key.
    - name: Install common NixOS configuration
      ansible.builtin.template:
        src: ../../modules/common.nix
        dest: /etc/nixos/common.nix
        mode: "0644"

    - name: Install network configuration
      ansible.builtin.template:
        src: ../../modules/network.nix.j2
        dest: /etc/nixos/network.nix
        mode: "0644"
      vars:
        host_name: "{{ webserver_vm_name }}"
        host_ip: "{{ final.ip }}"
        host_prefix_length: "{{ final.prefix_length }}"
        host_gateway: "{{ final.gateway }}"
        host_nameserver: "{{ final.nameserver }}"

    - name: Install webserver NixOS configuration
      ansible.builtin.copy:
        src: configuration.nix
        dest: /etc/nixos/configuration.nix
        mode: "0644"

    - name: Copy site files
      ansible.builtin.copy:
        src: site/
        dest: /var/www/
        mode: "0644"
        directory_mode: "0755"

    - name: Switch to the configuration and move to the webserver's address
      ansible.builtin.include_tasks: ../../modules/ansible/switch.yaml

# On the isolated network only the router can reach the webserver, so the
# check runs there.
- name: Check the webserver
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../proxmox/vars.yaml
    - ../router/vars.yaml
    - vars.yaml

  vars:
    final: "{{ hostvars['webserver'].final }}"

  tasks:
    - name: Check the site is served
      ansible.builtin.uri:
        url: "http://{{ final.ip }}/"
        status_code: 200
      register: site_check
      retries: 10
      delay: 3
      until: site_check is succeeded
      delegate_to: "{{ 'router' if final.via_router else 'localhost' }}"

    - name: Show where the site is
      ansible.builtin.debug:
        msg: >-
          {% if final.via_router -%}
          The webserver is on the isolated network at http://{{ final.ip }}/.
          To reach it from home, add a port forward in hosts/router/vars.yaml
          (lan_ip {{ final.ip }}) and run hosts/router/port-forwards.yaml.
          {%- else -%}
          The webserver is at http://{{ final.ip }}/.
          {%- endif %}
