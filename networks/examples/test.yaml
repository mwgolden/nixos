# A throwaway isolated network for trying out changes: a router, a web
# server and a reverse proxy in front of it, on their own bridge and VM IDs,
# away from the real VMs.
#
# Files in networks/examples/ are not read by validation or deploys. To use
# this one:
#   1. Pick a free address on the home LAN for the router's wan_ip below:
#      validation can only check it against the other network files, not
#      against devices this project doesn't manage.
#   2. cp networks/examples/test.yaml networks/test.yaml
#   3. ansible-playbook playbooks/deploy-network.yaml -e network=test
# Afterwards, remove everything with
#   ansible-playbook playbooks/destroy-network.yaml -e network=test -e remove_bridge=true
# and delete networks/test.yaml.

network:
  name: test
  type: isolated
  bridge: vmbr2
  cidr: 10.2.0.0/24
  gateway: 10.2.0.1
  nameserver: 10.2.0.1
  upstream: home
  dhcp:
    start: 10.2.0.100
    end: 10.2.0.199
    lease_time: 12h

hosts:
  - name: test-router
    type: router
    vm_id: 901
    ip: 10.2.0.1
    # Must be free on the home LAN.
    wan_ip: 192.168.1.20

  - name: test-web
    type: webserver
    vm_id: 902
    ip: 10.2.0.11
    # Served by test-proxy as https://web.test.home.arpa/.
    proxy:
      - name: web
        port: 80

  - name: test-proxy
    type: proxy
    vm_id: 903
    ip: 10.2.0.10

  # An LDAP server, with its web interface at https://users.test.home.arpa/.
  # Needs secrets/test/test-ldap.env first: copy roles/ldap/env.example.
  # - name: test-ldap
  #   type: ldap
  #   vm_id: 904
  #   ip: 10.2.0.12
  #   proxy:
  #     - name: users
  #       port: 17170
