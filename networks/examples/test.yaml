# A throwaway isolated network for trying out changes: a router, a web
# server on the LAN, and a reverse proxy in front of it in a DMZ, on their
# own bridges and VM IDs, away from the real VMs.
#
# Files in networks/examples/ are not read by validation or deploys. To use
# this one:
#   1. Pick a free address on the home LAN for the router's wan_ip below:
#      validation can only check it against the other network files, not
#      against devices this project doesn't manage.
#   2. cp networks/examples/test.yaml networks/test.yaml
#   3. ansible-playbook playbooks/deploy-network.yaml -e network=test
# Afterwards, remove everything with
#   ansible-playbook playbooks/destroy-network.yaml -e network=test -e remove_bridge=true
# and delete networks/test.yaml.

network:
  name: test
  type: isolated
  bridge: vmbr2
  cidr: 10.2.0.0/24
  gateway: 10.2.0.1
  nameserver: 10.2.0.1
  upstream: home
  dhcp:
    start: 10.2.0.100
    end: 10.2.0.199
    lease_time: 12h

  # A second bridge behind the router for published hosts. They reach the
  # LAN only through the proxy's routes and reach: entries.
  dmz:
    bridge: vmbr3
    cidr: 10.2.1.0/24
    gateway: 10.2.1.1

hosts:
  - name: test-router
    type: router
    vm_id: 901
    ip: 10.2.0.1
    # Must be free on the home LAN.
    wan_ip: 192.168.1.20

  - name: test-web
    type: webserver
    vm_id: 902
    ip: 10.2.0.11
    # Served by test-proxy as https://web.test.home.arpa/. The proxy is in
    # the DMZ, so the router lets it reach port 80 here. external: the
    # router also forwards its 443 and 80 to the proxy, so the site works
    # from home with "<wan_ip> web.test.home.arpa" in /etc/hosts.
    proxy:
      - name: web
        port: 80
        external: true
        external: true

  - name: test-proxy
    type: proxy
    zone: dmz
    vm_id: 903
    ip: 10.2.1.10

  # An LDAP server, with its web interface at https://users.test.home.arpa/.
  # Needs secrets/test/test-ldap.env first: copy roles/ldap/env.example.
  # - name: test-ldap
  #   type: ldap
  #   vm_id: 904
  #   ip: 10.2.0.12
  #   proxy:
  #     - name: users
  #       port: 17170
