# VMs directly on the home LAN. The home router provides the gateway, DNS
# and DHCP; this project only places VMs here. See README.md for the schema.

network:
  name: home
  type: home
  bridge: vmbr0
  cidr: 192.168.1.0/24
  gateway: 192.168.1.1
  nameserver: 192.168.1.1

  # Addresses no VM may use, besides the gateway and the template's address
  # (template_ip in proxmox/vars.yaml), which are always reserved.
  reserved: []

hosts:
  - name: nats
    type: nats
    vm_id: 118
    ip: 192.168.1.18
    data_disk:
      size_gb: 20
      storage: local-lvm
    settings:
      port: 4222
      jetstream:
        max_memory: 256M
        max_file: ""

  - name: ws
    type: workstation
    vm_id: 109
    ip: 192.168.1.19
    settings: 
      user: dev
      ssh_key_files: 
        - ~/.ssh/ws_lab.pub
      sudo: false
      packages: 
        - python3Packages.ipython
        - uv
        - nodejs_22
      environment: 
        EDITOR: nano
      tools: 
        - npm: "@anthropic-ai/claude-code"
        - uv: ruff
          version: "0.8.4"