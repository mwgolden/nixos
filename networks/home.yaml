# VMs directly on the home LAN. The home router provides the gateway, DNS
# and DHCP; this project only places VMs here. See README.md for the schema.

network:
  name: home
  type: home
  bridge: vmbr0
  cidr: 192.168.1.0/24
  gateway: 192.168.1.1
  nameserver: 192.168.1.1

  # Addresses no VM may use, besides the gateway and the template's address
  # (template_ip in proxmox/vars.yaml), which are always reserved.
  reserved: []

  # Which authorities this network uses. See README.md#security.
  security:
    strategy: centralized
    # Hosts here trust the SSH user CA of the openbao host below.
    administrative_identity:
      instance: home.openbao
    # Home's own secrets stay in secrets/home/
    # (docs/plans/NETWORK-SECURITY.md, decision 10).
    secrets:
      provider: files

hosts:
  - name: nats
    type: nats
    vm_id: 118
    ip: 192.168.1.18
    data_disk:
      size_gb: 20
      storage: local-lvm
    settings:
      port: 4222
      jetstream:
        max_memory: 256M
        max_file: ""

  - name: ws
    type: workstation
    cpu: x86-64-v2-AES
    cores: 4
    memory_mb: 8192
    vm_id: 109
    ip: 192.168.1.19
    settings: 
      user: dev
      ssh_key_files: 
        - ~/.ssh/ws_lab.pub
      sudo: false
      packages: 
        - python3Packages.ipython
        - uv
        - nodejs_22
      environment: 
        EDITOR: nano
      tools: 
        - npm: "@anthropic-ai/claude-code"
        - uv: ruff
          version: "0.8.4"

  # The SSH user CA for administrators (docs/plans/NETWORK-SECURITY.md).
  # Its unseal keys and root token: secrets/home/openbao-init.json.
  - name: openbao
    type: openbao
    vm_id: 120
    ip: 192.168.1.20
    data_disk:
      size_gb: 10
      storage: local-lvm
    settings:
      tls: self-signed           # certificate in secrets/home/openbao-tls.crt
      ssh_user_ca: true          # public key in secrets/home/openbao-ssh-user-ca.pub
      ssh_cert_max_ttl: 24h
      admin_mfa: false
      # Who may ask for certificates, such as
      #   - {name: alice, roles: [homelab-admin, home-operator], mfa: true}
      # Logins are made by hand; see roles/openbao/README.md,
      # "Adding an administrator".
      admins:
        - name: admin
          roles:
            - homelab-admin
