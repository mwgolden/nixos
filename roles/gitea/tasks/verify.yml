# Checks the gitea service answers and says how to reach it. Runs on
# localhost from roles/host_deploy; on an isolated network the check goes
# through the router.
# On the isolated network only the router can reach Gitea, so the check
# runs there.

- name: Check Gitea answers
  ansible.builtin.uri:
    url: "http://{{ final.ip }}:{{ gitea_http_port }}/api/healthz"
    status_code: 200
  register: gitea_check
  retries: 10
  delay: 3
  until: gitea_check is succeeded
  delegate_to: "{{ final.via_router or 'localhost' }}"

- name: Show where Gitea is
  ansible.builtin.debug:
    msg: >-
      {% if final.via_router and not gitea_public_host and not gitea_route and not gitea_web_forward -%}
      Gitea is up on the isolated network at {{ gitea_url | trim }}.
      To reach it from home, add expose: entries to {{ vm.name }} in
      networks/{{ vm.network.name }}.yaml ({name: web, port: {{ gitea_http_port }}}
      and {name: ssh, port: 22, wan_port: 2222}), or a proxy: route with
      external: true, and redeploy the router and {{ vm.name }}.
      {%- else -%}
      Gitea is up at {{ gitea_url | trim }}, with SSH clones at
      ssh://gitea@{{ gitea_ssh_host | trim }}:{{ gitea_url_ssh_port | trim }}/<owner>/<repo>.git.
      Log in as {{ gitea_admin_user }} (password in
      secrets/{{ vm.network.name }}/{{ vm.name }}.env).
      {%- endif %}
