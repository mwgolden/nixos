# Defaults for gitea hosts. Set any of gitea_settings_defaults under the host's
# settings: in its network file.

gitea_settings_defaults:
  # Port the web interface listens on. Git over SSH uses the VM's SSH on 22.
  http_port: 3000
  # The address people use to reach Gitea, shown in links and clone URLs.
  # Left empty, they are the VM's own address, http_port and 22. On an
  # isolated network, set them to the router's WAN address and the
  # forwarded ports, for example "192.168.1.13", 3000 and 2222.
  public_host: ""
  public_http_port: ""
  public_ssh_port: ""
  # Let anyone who can reach Gitea create an account. When false, only the
  # admin can add users.
  allow_registration: false

gitea_settings: "{{ gitea_settings_defaults | combine(vm.settings) }}"

# The names the configuration templates and tasks use.
gitea_http_port: "{{ gitea_settings.http_port }}"
gitea_public_host: "{{ gitea_settings.public_host }}"
gitea_public_http_port: "{{ gitea_settings.public_http_port }}"
gitea_public_ssh_port: "{{ gitea_settings.public_ssh_port }}"
gitea_allow_registration: "{{ gitea_settings.allow_registration }}"

gitea_vm_name: "{{ vm.name }}"
# Secrets for this host. See secrets/README.md.
gitea_secrets_file: "{{ role_path }}/../../secrets/{{ vm.network.name }}/{{ vm.name }}.env"

data_disk_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_gitea-data"
# Used in links and clone URLs; see public_* in gitea_settings_defaults.
gitea_url_host: "{{ gitea_public_host or final.ip }}"
gitea_url_http_port: "{{ gitea_public_http_port or gitea_http_port }}"
gitea_url_ssh_port: "{{ gitea_public_ssh_port or 22 }}"
# Runs the gitea command as the gitea user against the live settings.
gitea_cli: >-
  runuser -u gitea -- env GITEA_WORK_DIR=/var/lib/gitea
  GITEA_CUSTOM=/var/lib/gitea/custom gitea

gitea_url: >-
  http://{{ gitea_public_host or final.ip }}:{{ gitea_public_http_port or gitea_http_port }}/
