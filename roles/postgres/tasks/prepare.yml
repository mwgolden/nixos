# Checks the postgres host's secrets and settings before anything changes.
# Runs on localhost from roles/host_deploy. Facts it sets land on the VM's
# inventory entry, where configure.yml and verify.yml use them.

# From secrets/<network>/<host>.env, or the network's OpenBao host; see
# roles/host_secrets.
- name: Read the database admin login
  ansible.builtin.include_role:
    name: host_secrets
  vars:
    host_secrets_name: "{{ vm.name }}"
    host_secrets_missing_hint: "Copy roles/postgres/env.example there and set the admin login."

- name: Note the database admin login
  ansible.builtin.set_fact:
    postgres_admin_user: "{{ dotenv_values.POSTGRES_ADMIN_USER | default('') }}"
    postgres_admin_password: "{{ dotenv_values.POSTGRES_ADMIN_PASSWORD | default('') }}"
    # users-prepare.yml reads another set of secrets, so keep where these are.
    postgres_secrets_where: "{{ host_secrets_where }}"
  no_log: true

- name: Check database admin login
  ansible.builtin.assert:
    that:
      - postgres_admin_user is match('^[a-z_][a-z0-9_]*$')
      - postgres_admin_password | length > 0
    fail_msg: >-
      Set POSTGRES_ADMIN_USER (lowercase letters, digits, underscores) and
      POSTGRES_ADMIN_PASSWORD in {{ postgres_secrets_where }}.
    quiet: true

- name: Require users_database when users or schemas are set
  ansible.builtin.assert:
    that:
      - postgres_users_database | length > 0
    fail_msg: >-
      {{ vm.name }} lists database users or schemas, so set
      settings.users_database in networks/{{ vm.network.name }}.yaml.
    quiet: true
  when: postgres_users_settings_users | length > 0 or postgres_users_settings_schemas | length > 0

- name: Check the database users settings
  ansible.builtin.include_tasks: users-prepare.yml
  when: postgres_users_database | length > 0
