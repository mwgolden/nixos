# Sets the VM's CPU type to proxmox_vm_cpu_type if it differs, and works out
# whether a change is waiting for the VM to be stopped and started. Proxmox
# applies a CPU change to a stopped VM at once, and to a running one only on
# its next start: a reboot from inside the guest isn't enough.
#
# Included from main.yml, on localhost. Sets proxmox_vm_cpu: {current, next,
# pending} from the proxmox_cpu_state filter.

- name: Read the CPU type of VM {{ proxmox_vm_id }}
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ proxmox_vm_id }}/pending"
    headers:
      Authorization: >-
        PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}
    validate_certs: "{{ proxmox_validate_certs }}"
  register: proxmox_vm_pending_before
  delegate_to: localhost
  become: false
  no_log: true

- name: Note the CPU type of VM {{ proxmox_vm_id }}
  ansible.builtin.set_fact:
    proxmox_vm_cpu: "{{ proxmox_vm_pending_before.json.data | proxmox_cpu_state }}"

# Compared with what the VM gets next, so a change already waiting isn't
# set again on every deploy.
# Like api-set.yml, but a refusal is reported: the request carries the
# token, so its own output stays hidden.
- name: Set the CPU type of VM {{ proxmox_vm_id }} to {{ proxmox_vm_cpu_type }}
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ proxmox_vm_id }}/config"
    method: PUT
    headers:
      Authorization: >-
        PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}
    body_format: form-urlencoded
    body:
      cpu: "{{ proxmox_vm_cpu_type }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  register: proxmox_vm_cpu_set
  failed_when: false
  changed_when: true
  delegate_to: localhost
  become: false
  no_log: true
  when: proxmox_vm_cpu.next != proxmox_vm_cpu_type

- name: Require the CPU type change to be accepted
  ansible.builtin.assert:
    that:
      - proxmox_vm_cpu_set.status == 200
    fail_msg: >-
      Proxmox refused to set the CPU type of VM {{ proxmox_vm_id }}
      (HTTP {{ proxmox_vm_cpu_set.status }}{{ ': ' ~ proxmox_vm_cpu_set.json.message
      if (proxmox_vm_cpu_set.json.message | default('')) else '' }}).
      {% if proxmox_vm_cpu_set.status == 403 %}The API token needs VM.Config.CPU on
      /vms (in PVEVMAdmin). Check with: pveum user token permissions
      {{ proxmox_api_user }} {{ proxmox_api_token_id }} --path /vms/{{ proxmox_vm_id }}{% endif %}
    quiet: true
  when: proxmox_vm_cpu_set is not skipped

- name: Read the CPU type of VM {{ proxmox_vm_id }} again
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ proxmox_vm_id }}/pending"
    headers:
      Authorization: >-
        PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}
    validate_certs: "{{ proxmox_validate_certs }}"
  register: proxmox_vm_pending_after
  delegate_to: localhost
  become: false
  no_log: true
  when: proxmox_vm_cpu_set is not skipped

- name: Note the CPU type of VM {{ proxmox_vm_id }} after the change
  ansible.builtin.set_fact:
    proxmox_vm_cpu: "{{ proxmox_vm_pending_after.json.data | proxmox_cpu_state }}"
  when: proxmox_vm_pending_after is not skipped
