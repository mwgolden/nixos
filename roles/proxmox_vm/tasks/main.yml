# Makes sure a VM cloned from the NixOS template exists, with its data disk
# and network cards, and is running. Safe to re-run: an existing VM is
# checked and updated in place.
#
# Runs on localhost. Needs proxmox/vars.yaml loaded. Sets:
#   proxmox_vm_existing   the VM as it was before this ran (with its
#                         config), or none if it was just cloned
#   proxmox_vm_new_clone  true if the VM was just cloned
#   proxmox_vm_config     the VM's configuration once it is running
#   proxmox_vm_cpu        {current, next, pending}: its CPU type now, after
#                         its next stop and start, and whether they differ
#                         (only when proxmox_vm_cpu_type is set)

- name: Check required environment variables
  ansible.builtin.assert:
    that:
      - lookup('env', item) | length > 0
    fail_msg: "{{ item }} is not set. Run 'source proxmox/.env' first."
    quiet: true
  loop: "{{ proxmox_vm_required_env }}"

- name: Create or update VM {{ proxmox_vm_id }} ({{ proxmox_vm_name }})
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      validate_certs: "{{ proxmox_validate_certs }}"
  block:
    - name: Look up the {{ proxmox_vm_name }} VM
      community.proxmox.proxmox_vm_info:
        node: "{{ proxmox_node }}"
        vmid: "{{ proxmox_vm_id }}"
        config: current
      register: proxmox_vm_info

    - name: Note whether the VM exists
      ansible.builtin.set_fact:
        proxmox_vm_existing: "{{ proxmox_vm_info.proxmox_vms | first | default(none) }}"
        proxmox_vm_new_clone: "{{ proxmox_vm_info.proxmox_vms | length == 0 }}"

    - name: Make sure the VM ID belongs to the {{ proxmox_vm_name }} VM
      ansible.builtin.assert:
        that:
          - proxmox_vm_existing.name == proxmox_vm_name
        fail_msg: >-
          VM {{ proxmox_vm_id }} exists but is named '{{ proxmox_vm_existing.name }}',
          not '{{ proxmox_vm_name }}'. Refusing to configure it.
      when: not proxmox_vm_new_clone

    - name: Clone the {{ proxmox_vm_name }} VM from the NixOS template
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ template_vm_id }}"
        clone: "{{ template_vm_name }}"
        newid: "{{ proxmox_vm_id }}"
        name: "{{ proxmox_vm_name }}"
        full: "{{ proxmox_vm_full_clone }}"
        format: "{{ omit if proxmox_vm_full_clone else 'unspecified' }}"
        timeout: 300
      when: proxmox_vm_new_clone

    - name: Add or grow the data disk
      ansible.builtin.include_tasks: data-disk.yml
      when: proxmox_vm_data_disk | length > 0

    # A card that is already there is left as it is.
    - name: Add network cards
      community.proxmox.proxmox_nic:
        vmid: "{{ proxmox_vm_id }}"
        interface: "{{ item.interface }}"
        model: virtio
        bridge: "{{ item.bridge }}"
      loop: "{{ proxmox_vm_nics }}"
      loop_control:
        label: "{{ item.interface }} on {{ item.bridge }}"

    # Before the first start of a new clone, so it boots with it.
    - name: Set the CPU type of the {{ proxmox_vm_name }} VM
      ansible.builtin.include_tasks: cpu.yml
      when: proxmox_vm_cpu_type | length > 0

    # Only when asked: a redeploy for another change shouldn't take a
    # service down. A clean shutdown, never a forced stop.
    - name: Shut down the {{ proxmox_vm_name }} VM to apply its CPU type
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ proxmox_vm_id }}"
        state: stopped
        force: false
        timeout: "{{ proxmox_vm_shutdown_timeout }}"
      register: proxmox_vm_shutdown
      failed_when: false
      when:
        - proxmox_vm_cpu_type | length > 0
        - proxmox_vm_cpu.pending
        - proxmox_vm_restart | bool

    - name: Require the {{ proxmox_vm_name }} VM to shut down
      ansible.builtin.assert:
        that:
          - not (proxmox_vm_shutdown.failed | default(false))
        fail_msg: >-
          VM {{ proxmox_vm_id }} ({{ proxmox_vm_name }}) didn't shut down within
          {{ proxmox_vm_shutdown_timeout }} s: {{ proxmox_vm_shutdown.msg | default('') }}
          It was not forced off. Stop it in Proxmox, then run the deploy again.
        quiet: true
      when: proxmox_vm_shutdown is not skipped

    - name: Start the {{ proxmox_vm_name }} VM
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ proxmox_vm_id }}"
        state: started

    # A new clone's network card and the notes a deploy records are only
    # known once the VM exists.
    - name: Read the {{ proxmox_vm_name }} VM's configuration
      community.proxmox.proxmox_vm_info:
        node: "{{ proxmox_node }}"
        vmid: "{{ proxmox_vm_id }}"
        config: current
      register: proxmox_vm_info_after

    - name: Note the VM's configuration
      ansible.builtin.set_fact:
        proxmox_vm_config: "{{ (proxmox_vm_info_after.proxmox_vms | first).config }}"

    # Read for the report: whether the VM still waits for a stop and start.
    - name: Note whether the CPU type change is still waiting
      ansible.builtin.set_fact:
        proxmox_vm_cpu: >-
          {{ proxmox_vm_cpu | combine({'current': proxmox_vm_cpu.next, 'pending': false}) }}
      when:
        - proxmox_vm_cpu_type | length > 0
        - proxmox_vm_shutdown is not skipped

# Marks the VM as the project's, for its network and type. Only VMs with
# these tags are ever deleted by destroy-host, destroy-network or pruning.
# A VM deployed before tagging existed gets them here, on its next deploy.
- name: Tag the {{ proxmox_vm_name }} VM
  ansible.builtin.include_tasks: api-set.yml
  vars:
    proxmox_vm_api_vmid: "{{ proxmox_vm_id }}"
    proxmox_vm_api_config:
      tags: "{{ proxmox_vm_config.tags | default('') | proxmox_tags_merge(proxmox_vm_tags) }}"
  when:
    - proxmox_vm_tags | length > 0
    - (proxmox_vm_config.tags | default('') | proxmox_tags_merge(proxmox_vm_tags))
      != (proxmox_vm_config.tags | default(''))
