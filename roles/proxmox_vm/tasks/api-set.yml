# Sets options in a VM's Proxmox configuration through the API, leaving
# every other option alone. Used for the VM's tags and its notes, which the
# Proxmox modules can't change on their own. Runs on localhost.
# Set:
#   proxmox_vm_api_vmid    the VM ID
#   proxmox_vm_api_config  options to set, such as {tags: "a;b"}

- name: Set {{ proxmox_vm_api_config.keys() | join(', ') }} on VM {{ proxmox_vm_api_vmid }}
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ proxmox_vm_api_vmid }}/config"
    method: PUT
    headers:
      Authorization: >-
        PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}
    body_format: form-urlencoded
    body: "{{ proxmox_vm_api_config }}"
    validate_certs: "{{ proxmox_validate_certs }}"
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: true
