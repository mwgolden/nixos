# Installs and switches to the openbao VM's NixOS configuration, then
# initializes OpenBao on the first deploy, unseals it and mounts its KV
# secrets engines. With settings.tls, makes the listener's certificate
# first (tls.yml); with settings.pki, sets up the TLS root and
# intermediates (pki.yml); with settings.ssh_user_ca, sets up the SSH user
# CA and its administrators last (ssh-ca.yml, admins.yml). Runs on the VM
# with become: true, from roles/host_deploy.

- name: Install the shared NixOS configuration
  ansible.builtin.include_role:
    name: nixos_base
  vars:
    nixos_base_hostname: "{{ vm.name }}"
    nixos_base_data_disk_serial: openbao-data

- name: Install OpenBao settings
  ansible.builtin.template:
    src: openbao.nix.j2
    dest: /etc/nixos/openbao.nix
    mode: "0644"

- name: Make the listener's key and certificate
  ansible.builtin.include_tasks: tls.yml
  when: openbao_tls != 'none'

- name: Install openbao NixOS configuration
  ansible.builtin.copy:
    src: configuration.nix
    dest: /etc/nixos/configuration.nix
    mode: "0644"

- name: Switch to the configuration and move to the openbao address
  ansible.builtin.include_role:
    name: nixos_base
    tasks_from: switch

- name: Check the data disk is mounted
  ansible.builtin.command:
    cmd: findmnt --source {{ data_disk_device }} --target /var/lib/openbao
  changed_when: false

# ---- Running the new configuration ----
# NixOS doesn't restart OpenBao on a switch, since that seals it. Compare
# the command line it runs with the one its unit now has, which holds the
# path of the package and of the configuration file.

- name: Check OpenBao runs the current configuration
  ansible.builtin.shell:
    cmd: |
      set -eu
      pid=$(systemctl show -p MainPID --value openbao.service)
      if [ "$pid" = 0 ]; then echo stopped; exit 0; fi
      running=$(tr '\0' ' ' < /proc/"$pid"/cmdline | sed 's/ $//')
      wanted=$(systemctl show -p ExecStart --value openbao.service \
        | sed -n 's/.*argv\[\]=\(.*\) ; ignore_errors=.*/\1/p')
      if [ "$running" = "$wanted" ]; then echo current; else echo changed; fi
  register: openbao_running
  changed_when: false

- name: Restart OpenBao with the new configuration
  ansible.builtin.systemd_service:
    name: openbao
    state: restarted
  when: openbao_running.stdout == 'changed' or openbao_tls_changed | default(false)

- name: Start OpenBao
  ansible.builtin.systemd_service:
    name: openbao
    state: started
  when: openbao_running.stdout == 'stopped'

- name: Wait for OpenBao's API
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/sys/seal-status"
    ca_path: "{{ openbao_uri_ca or omit }}"
  register: openbao_seal
  retries: 20
  delay: 3
  until: openbao_seal is succeeded

# ---- First deploy: initialize ----

- name: Refuse to initialize over unseal keys from an earlier deploy
  ansible.builtin.assert:
    that: openbao_init is not defined
    fail_msg: >-
      OpenBao on {{ vm.name }} isn't initialized, but
      secrets/{{ vm.network.name }}/{{ vm.name }}-init.json has unseal keys
      from an earlier deploy, so its data disk is new or was wiped. If that's
      expected, move the file somewhere else and redeploy; the deploy then
      starts a new, empty OpenBao.
    quiet: true
  when: not openbao_seal.json.initialized

# The keys go to a root-only file on the VM first, and only leave it once
# they are safely in secrets/. If anything fails in between, the next deploy
# picks them up from there.
- name: Initialize OpenBao
  ansible.builtin.shell:
    cmd: >-
      umask 077 &&
      /run/current-system/sw/bin/bao operator init
      -address={{ openbao_local_url }}
      {{ ('-ca-cert=' ~ openbao_uri_ca) if openbao_uri_ca else '' }}
      -key-shares={{ openbao_key_shares }}
      -key-threshold={{ openbao_key_threshold }}
      -format=json > {{ openbao_pending_init_file }}.new &&
      mv {{ openbao_pending_init_file }}.new {{ openbao_pending_init_file }}
  when: not openbao_seal.json.initialized
  no_log: true

- name: Look for unseal keys not yet saved
  ansible.builtin.stat:
    path: "{{ openbao_pending_init_file }}"
  register: openbao_pending

- name: Save the unseal keys in secrets/
  when: openbao_pending.stat.exists
  block:
    - name: Read the new unseal keys
      ansible.builtin.slurp:
        src: "{{ openbao_pending_init_file }}"
      register: openbao_pending_content
      no_log: true

    - name: Note the new unseal keys
      ansible.builtin.set_fact:
        openbao_new_init: "{{ openbao_pending_content.content | b64decode | from_json }}"
      no_log: true

    # An earlier deploy may have saved them and stopped before deleting the
    # copy on the VM. Never replace keys that differ.
    - name: Check they are the keys already saved, if any
      ansible.builtin.assert:
        that: openbao_init.root_token == openbao_new_init.root_token
        fail_msg: >-
          {{ openbao_pending_init_file }} on {{ vm.name }} has different keys
          than secrets/{{ vm.network.name }}/{{ vm.name }}-init.json. Work out
          which one matches this OpenBao, keep it in secrets/, and delete the
          other.
        quiet: true
      when: openbao_init is defined

    - name: Write the unseal keys to secrets/
      ansible.builtin.copy:
        dest: "{{ openbao_init_file }}"
        content: "{{ openbao_new_init | to_nice_json }}\n"
        mode: "0600"
        force: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Note the unseal keys
      ansible.builtin.set_fact:
        openbao_init: "{{ openbao_new_init }}"
      no_log: true

    - name: Delete the copy on the VM
      ansible.builtin.file:
        path: "{{ openbao_pending_init_file }}"
        state: absent

- name: Require the unseal keys
  ansible.builtin.assert:
    that: openbao_init is defined
    fail_msg: >-
      OpenBao on {{ vm.name }} is already initialized, but
      secrets/{{ vm.network.name }}/{{ vm.name }}-init.json, with its unseal
      keys and root token, is missing. Restore it from your backup.
    quiet: true

# ---- Unseal ----

- name: Read the seal status
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/sys/seal-status"
    ca_path: "{{ openbao_uri_ca or omit }}"
  register: openbao_seal
  changed_when: false

- name: Unseal OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/sys/unseal"
    ca_path: "{{ openbao_uri_ca or omit }}"
    method: POST
    body_format: json
    body:
      key: "{{ item }}"
  loop: "{{ openbao_init.unseal_keys_b64[: openbao_init.unseal_threshold | int] }}"
  when: openbao_seal.json.sealed
  changed_when: true
  no_log: true

# 200 once this node is unsealed and active.
- name: Wait for OpenBao to be active
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/sys/health"
    ca_path: "{{ openbao_uri_ca or omit }}"
  register: openbao_health
  retries: 20
  delay: 3
  until: openbao_health is succeeded

# ---- KV secrets engines ----
# The network's mount (openbao_network_mount) always, then kv_mounts.

- name: List the secrets engines
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/sys/mounts"
    ca_path: "{{ openbao_uri_ca or omit }}"
    headers:
      X-Vault-Token: "{{ openbao_init.root_token }}"
    status_code: [200, 403]
  register: openbao_mounts
  no_log: true

# The deploys of the other hosts on this network use the same token to
# read their secrets, so it can't be done without.
- name: Check the root token still works
  ansible.builtin.assert:
    that: openbao_mounts.status == 200
    fail_msg: >-
      The root token in secrets/{{ vm.network.name }}/{{ vm.name }}-init.json
      was refused, so it has been revoked. This deploy needs it for the
      {{ openbao_network_mount }}/ mount, and the deploys of the other hosts
      on {{ vm.network.name }} need it to read their secrets there. Make a
      new one (bao operator generate-root) and put it in root_token there.
    quiet: true

- name: Mount KV secrets engines
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/sys/mounts/{{ item }}"
    ca_path: "{{ openbao_uri_ca or omit }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_init.root_token }}"
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    status_code: [200, 204]
  loop: "{{ [openbao_network_mount] + openbao_kv_mounts }}"
  when: (item ~ '/') not in openbao_mounts.json.data
  changed_when: true

# ---- Tokens for the network's deploys and hosts ----

- name: Make and renew the network's tokens
  ansible.builtin.include_tasks: tokens.yml
  when: (nixlab | network_secrets_store(vm.network.name)).host_id | default('') == vm.id

# ---- TLS root and intermediates ----

- name: Set up the TLS root and intermediates
  ansible.builtin.include_tasks: pki.yml
  when: openbao_pki | bool

# On the deploy that makes this host's own root, its listener started
# self-signed, since there was no root to get a certificate from yet. Get
# one now, and restart with it.
- name: Move the listener to a certificate from this host's own root
  when:
    - openbao_tls == 'pki'
    - openbao_tls_source == 'self-signed'
    - (nixos_base_pki.instance | default('')) == vm.id
  block:
    - name: Get this host's TLS certificate
      ansible.builtin.include_role:
        name: nixos_base
        tasks_from: tls-cert

    - name: Note the root exists now
      ansible.builtin.set_fact:
        nixos_base_pki_root: true
        openbao_tls_late: true

    - name: Use the new certificate for the listener
      ansible.builtin.include_tasks: tls.yml

    - name: Restart OpenBao to use it
      ansible.builtin.include_tasks: restart.yml
      when: openbao_tls_changed | bool

    - name: Say the VM trusts the root from its next deploy
      ansible.builtin.debug:
        msg: >-
          {{ vm.name }}'s listener now has a certificate from its own root.
          The VM's own trusted certificates get the root on its next deploy.
      when: openbao_tls_source == 'pki'

# ---- SSH user CA and its administrators ----

- name: Set up the SSH user CA
  ansible.builtin.include_tasks: ssh-ca.yml
  vars:
    openbao_ca_kind: user
    openbao_ca_mount: "{{ openbao_ssh_user_mount }}"
    openbao_ca_file: "{{ openbao_ssh_user_ca_file }}"
    openbao_ca_file_short: "{{ openbao_ssh_user_ca_file_short }}"
    openbao_ca_trusted_by: hosts of every network that trusts it
  when: openbao_ssh_user_ca

- name: Write the SSH user CA's signing roles
  ansible.builtin.include_tasks: ssh-user-roles.yml
  when: openbao_ssh_user_ca

- name: Set up the SSH host CA
  ansible.builtin.include_tasks: ssh-ca.yml
  vars:
    openbao_ca_kind: host
    openbao_ca_mount: "{{ openbao_ssh_host_mount }}"
    openbao_ca_file: "{{ openbao_ssh_host_ca_file }}"
    openbao_ca_file_short: "{{ openbao_ssh_host_ca_file_short }}"
    openbao_ca_trusted_by: the machines you SSH from (scripts/ssh-cert --trust-hosts)
  when: openbao_ssh_host_ca

- name: Write the SSH host CA's signing roles
  ansible.builtin.include_tasks: ssh-host-roles.yml
  when: openbao_ssh_host_ca

- name: Set up the administrators
  ansible.builtin.include_tasks: admins.yml
  when: openbao_ssh_user_ca
