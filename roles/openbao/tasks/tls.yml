# The listener's key and certificate (settings.tls), in openbao_tls_dir,
# root-only; systemd hands them to OpenBao (LoadCredential).
#
# - pki: the host's own certificate from its network's PKI
#   (roles/nixos_base, tls-cert.yml, in /etc/nixlab/tls), copied here.
#   Until it has one (its authority isn't deployed yet, or is this host on
#   the deploy that makes it), a self-signed one as below.
# - self-signed: made here, renewed when fewer than openbao_tls_renew_days
#   are left or its names change.
#
# Also keeps ca.pem, what the deploy's own requests trust, and
# secrets/<network>/<host>-tls.crt, what clients trust (BAO_CACERT, other
# hosts' deploys): the self-signed certificate, or the PKI's root.
# Included from configure.yml before the switch, so the files exist when
# OpenBao starts, and again once this host's own root exists. Runs on the
# VM. Sets openbao_tls_changed, which restarts OpenBao, and
# openbao_tls_source (pki or self-signed).

- name: Make the TLS folder
  ansible.builtin.file:
    path: "{{ openbao_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Note where the listener's certificate comes from
  ansible.builtin.set_fact:
    openbao_tls_source: >-
      {{ 'pki' if openbao_tls == 'pki' and nixos_base_tls_cert | default(false) | bool
                  and nixos_base_pki_root | default(false) | bool
         else 'self-signed' }}

- name: Say the listener is self-signed for now
  ansible.builtin.debug:
    msg: >-
      settings.tls of {{ vm.name }} is pki, but it has no certificate from
      {{ nixos_base_pki.instance | default('its network\'s PKI') }} yet, so its
      listener uses a self-signed one for now
      ({{ openbao_tls_cert_file_short }}).
      {% if (nixos_base_pki.instance | default('')) != vm.id %}Deploy
      {{ nixos_base_pki.instance | default('the authority') }}, then this host again.{% endif %}
  when: openbao_tls == 'pki' and openbao_tls_source == 'self-signed' and not openbao_tls_late | default(false)

# ---- From the network's PKI ----

- name: Use this host's certificate from {{ nixos_base_pki.instance | default('its PKI') }}
  when: openbao_tls_source == 'pki'
  block:
    - name: Copy the certificate chain for the listener
      ansible.builtin.copy:
        src: "{{ nixos_base_tls_dir }}/fullchain.pem"
        dest: "{{ openbao_tls_cert }}"
        remote_src: true
        mode: "0644"
      register: openbao_tls_pki_cert

    - name: Copy the key for the listener
      ansible.builtin.copy:
        src: "{{ nixos_base_tls_dir }}/key.pem"
        dest: "{{ openbao_tls_key }}"
        remote_src: true
        mode: "0600"
      register: openbao_tls_pki_key

    - name: Trust the root for the deploy's own requests
      ansible.builtin.copy:
        src: "{{ role_path }}/../../{{ nixos_base_pki.root_file }}"
        dest: "{{ openbao_uri_ca }}"
        mode: "0644"

    - name: Note whether the listener's certificate changed
      ansible.builtin.set_fact:
        openbao_tls_changed: "{{ openbao_tls_pki_cert is changed or openbao_tls_pki_key is changed }}"

# ---- Self-signed ----

- name: Use a self-signed certificate
  when: openbao_tls_source == 'self-signed'
  block:
    - name: Write the certificate's settings
      ansible.builtin.copy:
        dest: "{{ openbao_tls_dir }}/cert.cnf"
        mode: "0600"
        content: |
          # Generated by Ansible from roles/openbao/tasks/tls.yml.
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = {{ vm.id }} OpenBao
          [ext]
          basicConstraints = critical,CA:TRUE,pathlen:0
          keyUsage = critical,digitalSignature,keyCertSign
          extendedKeyUsage = serverAuth
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid:always
          subjectAltName = {{ openbao_tls_names | join(',') }}
      register: openbao_tls_cnf

    # Prints current, renew or missing. A certificate from a PKI (the
    # network stopped using one) counts as missing.
    - name: Check the certificate
      ansible.builtin.shell:
        cmd: |
          set -eu
          [ -f {{ openbao_tls_cert }} ] && [ -f {{ openbao_tls_key }} ] || { echo missing; exit 0; }
          nix-shell -p openssl --run \
            "openssl x509 -in {{ openbao_tls_cert }} -noout -checkend {{ openbao_tls_renew_days * 86400 }}" \
            >/dev/null 2>&1 || { echo renew; exit 0; }
          names=$(nix-shell -p openssl --run "openssl x509 -in {{ openbao_tls_cert }} -noout -subject -issuer")
          [ "$(printf '%s\n' "$names" | sed -n 's/^subject=//p')" = "$(printf '%s\n' "$names" | sed -n 's/^issuer=//p')" ] \
            || { echo missing; exit 0; }
          echo current
      register: openbao_tls_state
      changed_when: false

    # New names (another address) also need a new certificate.
    - name: Make the key and certificate
      ansible.builtin.shell:
        cmd: |
          set -eu
          umask 077
          cd {{ openbao_tls_dir }}
          nix-shell -p openssl --run \
            "openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
               -days {{ openbao_tls_days }} -config cert.cnf -keyout key.pem.new -out cert.pem.new"
          chmod 600 key.pem.new
          chmod 644 cert.pem.new
          mv key.pem.new key.pem
          mv cert.pem.new cert.pem
      when: openbao_tls_state.stdout != 'current' or openbao_tls_cnf is changed
      register: openbao_tls_made
      changed_when: true

    - name: Trust the certificate for the deploy's own requests
      ansible.builtin.copy:
        src: "{{ openbao_tls_cert }}"
        dest: "{{ openbao_uri_ca }}"
        remote_src: true
        mode: "0644"

    - name: Note whether the certificate changed
      ansible.builtin.set_fact:
        openbao_tls_changed: "{{ openbao_tls_made is changed }}"

# ---- What clients trust ----

- name: Copy what clients trust to {{ openbao_tls_cert_file_short }}
  ansible.builtin.fetch:
    src: "{{ openbao_uri_ca }}"
    dest: "{{ openbao_tls_cert_file }}"
    flat: true
