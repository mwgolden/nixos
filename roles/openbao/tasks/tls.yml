# A key and self-signed certificate for the listener (settings.tls:
# self-signed). Made on the VM, where the key stays, root-only; made again
# when the certificate's names change or fewer than openbao_tls_renew_days
# are left. The certificate is copied to secrets/<network>/<host>-tls.crt
# for clients to trust. Included from configure.yml before the switch, so
# the listener's files exist when OpenBao starts. Runs on the VM.
# Sets openbao_tls_changed, which restarts OpenBao in configure.yml.

- name: Make the TLS folder
  ansible.builtin.file:
    path: "{{ openbao_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the certificate's settings
  ansible.builtin.copy:
    dest: "{{ openbao_tls_dir }}/cert.cnf"
    mode: "0600"
    content: |
      # Generated by Ansible from roles/openbao/tasks/tls.yml.
      [req]
      distinguished_name = dn
      x509_extensions = ext
      prompt = no
      [dn]
      CN = {{ vm.id }} OpenBao
      [ext]
      basicConstraints = critical,CA:TRUE,pathlen:0
      keyUsage = critical,digitalSignature,keyCertSign
      extendedKeyUsage = serverAuth
      subjectKeyIdentifier = hash
      authorityKeyIdentifier = keyid:always
      subjectAltName = {{ openbao_tls_names | join(',') }}
  register: openbao_tls_cnf

# Prints current, renew or missing.
- name: Check the certificate
  ansible.builtin.shell:
    cmd: |
      set -eu
      [ -f {{ openbao_tls_cert }} ] && [ -f {{ openbao_tls_key }} ] || { echo missing; exit 0; }
      nix-shell -p openssl --run \
        "openssl x509 -in {{ openbao_tls_cert }} -noout -checkend {{ openbao_tls_renew_days * 86400 }}" \
        >/dev/null 2>&1 || { echo renew; exit 0; }
      echo current
  register: openbao_tls_state
  changed_when: false

# New names (another address) also need a new certificate.
- name: Make the key and certificate
  ansible.builtin.shell:
    cmd: |
      set -eu
      umask 077
      cd {{ openbao_tls_dir }}
      nix-shell -p openssl --run \
        "openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
           -days {{ openbao_tls_days }} -config cert.cnf -keyout key.pem.new -out cert.pem.new"
      chmod 600 key.pem.new
      chmod 644 cert.pem.new
      mv key.pem.new key.pem
      mv cert.pem.new cert.pem
  when: openbao_tls_state.stdout != 'current' or openbao_tls_cnf is changed
  register: openbao_tls_made
  changed_when: true

- name: Note whether the certificate changed
  ansible.builtin.set_fact:
    openbao_tls_changed: "{{ openbao_tls_made is changed }}"

- name: Copy the certificate to {{ openbao_tls_cert_file_short }}
  ansible.builtin.fetch:
    src: "{{ openbao_tls_cert }}"
    dest: "{{ openbao_tls_cert_file }}"
    flat: true
