# An SSH CA: an SSH secrets engine whose key never leaves OpenBao, and its
# public key written to secrets/ for the other deploys
# (docs/plans/NETWORK-SECURITY.md, 4.2.3 and 4.3). Included from
# configure.yml once OpenBao is unsealed, with:
#   openbao_ca_kind        user or host, for messages
#   openbao_ca_mount       ssh-client-signer or ssh-host-signer
#   openbao_ca_file        where the public key goes, and its _short name
#   openbao_ca_trusted_by  who would stop trusting a new key, for messages
# Sets openbao_ssh_ca_key. Runs on the VM.

- name: Mount the SSH {{ openbao_ca_kind }} CA's engine
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/sys/mounts/{{ openbao_ca_mount }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_init.root_token }}"
    body_format: json
    body:
      type: ssh
    ca_path: "{{ openbao_uri_ca or omit }}"
    status_code: [200, 204]
  when: (openbao_ca_mount ~ '/') not in openbao_mounts.json.data
  changed_when: true
  no_log: true

# 400 until a key is made.
- name: Read the SSH {{ openbao_ca_kind }} CA's public key
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/{{ openbao_ca_mount }}/config/ca"
    headers:
      X-Vault-Token: "{{ openbao_init.root_token }}"
    ca_path: "{{ openbao_uri_ca or omit }}"
    status_code: [200, 400]
  register: openbao_ssh_ca
  no_log: true

- name: Look for the CA public key from an earlier deploy
  ansible.builtin.stat:
    path: "{{ openbao_ca_file }}"
  register: openbao_ssh_ca_file_stat
  delegate_to: localhost
  become: false

- name: Read the CA public key from an earlier deploy
  ansible.builtin.set_fact:
    openbao_ssh_ca_saved: "{{ lookup('ansible.builtin.file', openbao_ca_file) | trim }}"
  when: openbao_ssh_ca_file_stat.stat.exists

# Everything that trusts this CA has the key in the file. A new key would
# break that trust everywhere, so it is never made over an old one.
- name: Refuse to make a new CA key while hosts trust the old one
  ansible.builtin.assert:
    that: not openbao_ssh_ca_file_stat.stat.exists
    fail_msg: >-
      OpenBao on {{ vm.name }} has no SSH {{ openbao_ca_kind }} CA key, but
      {{ openbao_ca_file_short }} has the public key of one from an
      earlier deploy, and {{ openbao_ca_trusted_by }} trust it. The key is gone with OpenBao's old
      data. If that is expected, move the file away and redeploy: a new key
      is made, and {{ openbao_ca_trusted_by }} must be told about it again.
    quiet: true
  when: openbao_ssh_ca.status == 400

- name: Make the SSH {{ openbao_ca_kind }} CA's key inside OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/{{ openbao_ca_mount }}/config/ca"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_init.root_token }}"
    body_format: json
    body:
      generate_signing_key: true
      key_type: ed25519
    ca_path: "{{ openbao_uri_ca or omit }}"
    status_code: [200, 204]
  register: openbao_ssh_ca_made
  when: openbao_ssh_ca.status == 400
  changed_when: true
  no_log: true

- name: Read the new public key
  ansible.builtin.uri:
    url: "{{ openbao_local_url }}/v1/{{ openbao_ca_mount }}/config/ca"
    headers:
      X-Vault-Token: "{{ openbao_init.root_token }}"
    ca_path: "{{ openbao_uri_ca or omit }}"
  register: openbao_ssh_ca_new
  when: openbao_ssh_ca.status == 400
  no_log: true

- name: Note the CA public key
  ansible.builtin.set_fact:
    openbao_ssh_ca_key: >-
      {{ (openbao_ssh_ca_new.json if openbao_ssh_ca.status == 400 else openbao_ssh_ca.json).data.public_key | trim }}

- name: Refuse a CA key that isn't the one hosts trust
  ansible.builtin.assert:
    that: openbao_ssh_ca_saved == openbao_ssh_ca_key
    fail_msg: >-
      The SSH {{ openbao_ca_kind }} CA on {{ vm.name }} has a different key from the one in
      {{ openbao_ca_file_short }}, which {{ openbao_ca_trusted_by }} trust. Nothing was
      changed. If the CA's key was replaced on purpose, move the file away
      and redeploy; then {{ openbao_ca_trusted_by }} must be told about it again.
    quiet: true
  when: openbao_ssh_ca_file_stat.stat.exists

- name: Write the CA public key to {{ openbao_ca_file_short }}
  ansible.builtin.copy:
    content: "{{ openbao_ssh_ca_key }}\n"
    dest: "{{ openbao_ca_file }}"
    mode: "0644"
  delegate_to: localhost
  become: false
