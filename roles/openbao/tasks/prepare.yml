# Checks the openbao host's settings, and reads its unseal keys if an
# earlier deploy wrote them, before anything changes. Runs on localhost from
# roles/host_deploy. Facts it sets land on the VM's inventory entry, where
# configure.yml and verify.yml use them.

- name: Check the settings
  ansible.builtin.assert:
    that:
      - openbao_port | string is match('^[0-9]+$')
      - openbao_port | int >= 1 and openbao_port | int <= 65535
      - openbao_port | int != openbao_cluster_port
      - openbao_key_shares | string is match('^[0-9]+$')
      - openbao_key_threshold | string is match('^[0-9]+$')
      - openbao_key_threshold | int >= 1
      - openbao_key_shares | int >= openbao_key_threshold | int
      - openbao_key_shares | int <= 10
      - openbao_key_threshold | int > 1 or openbao_key_shares | int == 1
      - openbao_kv_mounts is sequence and openbao_kv_mounts is not string
    fail_msg: >-
      Check settings of {{ vm.name }} in networks/{{ vm.network.name }}.yaml:
      port must be 1 to 65535 (not {{ openbao_cluster_port }}, used by raft),
      key_threshold at least 1 and at most key_shares, key_shares at most 10
      (and 1 if key_threshold is 1), and kv_mounts a list.
    quiet: true

- name: Check the KV mount paths
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[a-z0-9][a-z0-9_-]{0,62}$')
      - item not in ['sys', 'auth', 'identity', 'cubbyhole']
    fail_msg: >-
      '{{ item }}' in settings.kv_mounts isn't a usable mount path. Use up to
      63 lowercase letters, digits, '_' and '-', starting with a letter or
      digit, and not sys, auth, identity or cubbyhole.
    quiet: true
  loop: "{{ openbao_kv_mounts }}"

# The network's mount holds the other hosts' secrets (see
# roles/host_secrets); every deploy makes it, so it can't also be in
# kv_mounts. networks/ validation catches this too.
- name: Check the network's mount isn't in kv_mounts
  ansible.builtin.assert:
    that:
      - openbao_network_mount not in openbao_kv_mounts
    fail_msg: >-
      settings.kv_mounts of {{ vm.name }} in networks/{{ vm.network.name }}.yaml
      lists '{{ openbao_network_mount }}', the network's own mount, which
      every deploy of {{ vm.name }} makes for the network's secrets. Remove
      it from kv_mounts.
    quiet: true

- name: Look for the unseal keys from an earlier deploy
  ansible.builtin.stat:
    path: "{{ openbao_init_file }}"
  register: openbao_init_stat

- name: Read the unseal keys
  ansible.builtin.set_fact:
    openbao_init: "{{ lookup('ansible.builtin.file', openbao_init_file) | from_json }}"
  when: openbao_init_stat.stat.exists
  no_log: true

- name: Check the unseal keys
  ansible.builtin.assert:
    that:
      - openbao_init.root_token | default('') | length > 0
      - openbao_init.unseal_keys_b64 | default([]) | length >= openbao_init.unseal_threshold | default(1)
    fail_msg: >-
      secrets/{{ vm.network.name }}/{{ vm.name }}-init.json doesn't have the
      root_token, unseal_keys_b64 and unseal_threshold the first deploy wrote
      there. Restore it from your backup.
    quiet: true
  when: openbao_init_stat.stat.exists

# networks/ validation checks the settings' shapes; this needs the
# inventory: which roles exist depends on the networks that trust this host.
- name: Check the admins' roles
  ansible.builtin.assert:
    that:
      - item.roles | difference(openbao_ssh_roles) | length == 0
    fail_msg: >-
      settings.admins of {{ vm.name }} in networks/{{ vm.network.name }}.yaml:
      {{ item.name }} has roles this CA doesn't sign:
      {{ item.roles | difference(openbao_ssh_roles) | join(', ') }}. It signs
      {{ openbao_ssh_roles | join(', ') }}: homelab-admin, and the principals
      of every network whose administrative_identity is {{ vm.id }}.
    quiet: true
  loop: "{{ openbao_admins }}"
  loop_control:
    label: "{{ item.name }}"
  when: openbao_ssh_user_ca

- name: Refuse settings that aren't deployed yet
  ansible.builtin.assert:
    that:
      - openbao_tls in ['none', 'self-signed']
    fail_msg: >-
      settings of {{ vm.name }}: tls: pki isn't deployed yet (phase 4 of
      docs/plans/NETWORK-SECURITY.md).
    quiet: true
