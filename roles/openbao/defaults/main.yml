# Defaults for openbao hosts. Set any of openbao_settings_defaults under the
# host's settings: in its network file.

openbao_settings_defaults:
  # Port the API and web UI listen on.
  port: 8200
  # Serve the web UI at http://<host>:<port>/ui.
  ui: true
  # How many unseal keys the first deploy makes, and how many of them it
  # takes to unseal. Only used when OpenBao is initialized; changing them
  # later does nothing (use bao operator rekey).
  key_shares: 1
  key_threshold: 1
  # KV version 2 secrets engines to mount, by path. Created if missing;
  # removing a name doesn't delete the mount or its secrets.
  kv_mounts:
    - secret
  # HTTPS on the listener: none (plain HTTP), self-signed (a key and
  # certificate made on the VM), or pki (the host's certificate from its
  # network's PKI, security.pki; docs/plans/completed/INTERNAL-CA.md). What clients
  # trust is copied to secrets/<network>/<host>-tls.crt: the self-signed
  # certificate, or the PKI's root.
  tls: none
  # Addresses or subnets allowed to reach the port. [] means anyone who can
  # reach the VM, as before.
  admin_sources: []
  # Sign administrators' SSH certificates (an SSH user CA). Needs tls.
  ssh_user_ca: false
  # Longest certificate it signs, and the TTL each role gives by default.
  ssh_cert_max_ttl: 24h
  # Administrators allowed to ask for certificates: {name, roles, mfa}.
  # roles are principals such as homelab-admin or <network>-admin. See
  # README.md, "SSH certificates".
  admins: []
  # Every admin needs a TOTP code as well as the password. An admin's own
  # mfa: true or false overrides this.
  admin_mfa: false
  # Sign hosts' SSH host certificates (an SSH host CA). Needs tls. Hosts of
  # networks with administrative_identity.ssh_host_ca get one from their
  # deploy, valid for ssh_host_cert_ttl.
  ssh_host_ca: false
  ssh_host_cert_ttl: 8760h
  # A TLS root CA, and an intermediate for every network whose
  # security.pki names this host (docs/plans/completed/INTERNAL-CA.md). Needs tls.
  # true, or a mapping overriding openbao_pki_defaults below.
  pki: false

# settings.pki: true means these; a mapping there overrides any of them.
# They mirror PKI_SETTINGS_DEFAULTS in plugins/filter/network_config.py.
openbao_pki_defaults:
  # The root's name constraint: it can only vouch for names under these,
  # so every network that uses it needs its domain under one. Only read
  # when the root is made; a different list needs a new root.
  permitted_domains:
    - home.arpa
  root_ttl: 87600h          # 10 years
  intermediate_ttl: 43800h  # 5 years, re-signed with openbao_pki_resign_days left
  cert_ttl: 8760h           # hosts' certificates; renewed by deploys with 30 days left

openbao_settings: "{{ openbao_settings_defaults | combine(vm.settings) }}"

# The names the configuration templates and tasks use.
openbao_port: "{{ openbao_settings.port }}"
openbao_ui: "{{ openbao_settings.ui | bool }}"
openbao_key_shares: "{{ openbao_settings.key_shares }}"
openbao_key_threshold: "{{ openbao_settings.key_threshold }}"
openbao_kv_mounts: "{{ openbao_settings.kv_mounts }}"
# The KV version 2 mount every deploy makes, named after the network: the
# other hosts' deploys keep their secrets at <network>/<host> there (see
# roles/host_secrets and the network_secrets_store filter). Separate from
# kv_mounts, so removing names there can't break those deploys.
openbao_network_mount: "{{ vm.network.name }}"
# Raft's cluster port, on loopback only: with a single node nothing else
# needs it.
openbao_cluster_port: 8201

openbao_vm_name: "{{ vm.name }}"
# The router's WAN address, where port forwards to an isolated host are.
router_ip: "{{ nixlab.networks[vm.network.name].router_wan_ip }}"
# Written by the first deploy: the unseal keys and root token. See
# secrets/README.md.
openbao_init_file: "{{ role_path }}/../../secrets/{{ vm.network.name }}/{{ vm.name }}-init.json"
# Where the first deploy writes the same, root-only on the VM, until it is
# copied to openbao_init_file. Then it is deleted.
openbao_pending_init_file: /root/openbao-init.json

data_disk_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_openbao-data"

openbao_tls: "{{ openbao_settings.tls }}"
openbao_scheme: "{{ 'http' if openbao_tls == 'none' else 'https' }}"
openbao_admin_sources: "{{ openbao_settings.admin_sources }}"
# The listener's key and certificate on the VM, root-only. OpenBao gets
# them through systemd's LoadCredential (see templates/openbao.nix.j2).
openbao_tls_dir: /etc/openbao/tls
openbao_tls_cert: "{{ openbao_tls_dir }}/cert.pem"
openbao_tls_key: "{{ openbao_tls_dir }}/key.pem"
# Made again when fewer days than this are left.
openbao_tls_days: 730
openbao_tls_renew_days: 30
# Where clients find the certificate to trust it.
openbao_tls_cert_file: "{{ role_path }}/../../secrets/{{ vm.network.name }}/{{ vm.name }}-tls.crt"
openbao_tls_cert_file_short: "secrets/{{ vm.network.name }}/{{ vm.name }}-tls.crt"
# Names and addresses in the certificate.
openbao_tls_names: >-
  {{ ['IP:' ~ final.ip, 'IP:127.0.0.1', 'DNS:' ~ vm.name, 'DNS:localhost']
     + (['DNS:' ~ vm.dns_name] if vm.dns_name else []) }}
# What the deploy's own requests on the VM trust, kept by tls.yml: a copy
# of the self-signed certificate, or the PKI's root; nothing (omit) with
# plain HTTP.
openbao_uri_ca: "{{ (openbao_tls_dir ~ '/ca.pem') if openbao_tls != 'none' else '' }}"

# ---- TLS root and intermediates (tasks/pki.yml) ----
openbao_pki: "{{ openbao_settings.pki is mapping or openbao_settings.pki | bool }}"
openbao_pki_settings: >-
  {{ openbao_pki_defaults | combine(openbao_settings.pki if openbao_settings.pki is mapping else {}) }}
openbao_pki_root_mount: pki
# Names with spaces, so no client mistakes them for host names to check
# against the name constraints.
openbao_pki_root_name: "nixlab root on {{ vm.id }}"
openbao_pki_intermediate_name: "nixlab NETWORK intermediate"
# {network, mount, domain, ip_cidrs, file} for each network using this host.
openbao_pki_networks: "{{ nixlab | pki_networks(vm.id) }}"
openbao_pki_root_file_short: "{{ vm.id | pki_root_file }}"
openbao_pki_root_file: "{{ role_path }}/../../{{ openbao_pki_root_file_short }}"
# An intermediate with fewer days left is signed again: more than a host
# certificate's year, so one always fits under it.
openbao_pki_resign_days: 400
# -e openbao_pki_rotate=<network>: a new intermediate for that network now.
openbao_pki_rotate: ""
# -e openbao_pki_prune=true: remove intermediates no network uses.
openbao_pki_prune: false

# ---- SSH user CA (tasks/ssh-ca.yml) and administrators (tasks/admins.yml) ----
openbao_ssh_user_ca: "{{ openbao_settings.ssh_user_ca | bool }}"
openbao_ssh_user_mount: ssh-client-signer
openbao_ssh_cert_max_ttl: "{{ openbao_settings.ssh_cert_max_ttl }}"
openbao_ssh_user_ca_file: "{{ role_path }}/../../secrets/{{ vm.network.name }}/{{ vm.name }}-ssh-user-ca.pub"
openbao_ssh_user_ca_file_short: "secrets/{{ vm.network.name }}/{{ vm.name }}-ssh-user-ca.pub"
# homelab-admin, then <network>-admin and <network>-operator for every
# network whose administrative_identity is this host.
openbao_ssh_roles: "{{ nixlab | openbao_ssh_roles(vm.id) }}"
# Those whose certificates may also forward ports (ssh -J through a router).
openbao_ssh_admin_roles: "{{ nixlab | openbao_ssh_admin_roles(vm.id) }}"
openbao_ssh_host_ca: "{{ openbao_settings.ssh_host_ca | bool }}"
openbao_ssh_host_mount: ssh-host-signer
openbao_ssh_host_cert_ttl: "{{ openbao_settings.ssh_host_cert_ttl }}"
openbao_ssh_host_ca_file: "{{ role_path }}/../../secrets/{{ vm.network.name }}/{{ vm.name }}-ssh-host-ca.pub"
openbao_ssh_host_ca_file_short: "secrets/{{ vm.network.name }}/{{ vm.name }}-ssh-host-ca.pub"
# hosts-<network>, with that network's hosts' names and addresses.
openbao_ssh_host_roles: "{{ nixlab | openbao_ssh_host_roles(vm.id) }}"
openbao_admins: "{{ openbao_settings.admins }}"
openbao_admin_mfa: "{{ openbao_settings.admin_mfa | bool }}"
openbao_userpass_mount: userpass
# How long a login lasts: long enough to sign, then scripts/ssh-cert
# revokes it.
openbao_admin_token_ttl: 15m
openbao_mfa_method_name: admins-totp
openbao_audit_file: /var/lib/openbao/audit.log

# The API as the deploy reaches it on the VM itself.
openbao_local_url: "{{ openbao_scheme }}://127.0.0.1:{{ openbao_port }}"
openbao_url: "{{ openbao_scheme }}://{{ final.ip }}:{{ openbao_port }}"
