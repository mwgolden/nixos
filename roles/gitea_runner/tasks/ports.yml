# Ports a gitea_runner host may listen on, besides SSH (22). Used by
# roles/network_verify to find unexpected services. The cache server
# listens on every address, but the firewall only lets job containers in.

- name: Note the ports gitea_runner listens on
  ansible.builtin.set_fact:
    verify_expected_ports: ["{{ gitea_runner_cache_port | int }}"]
