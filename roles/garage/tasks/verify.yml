# Checks the garage service answers and says how to reach it. Runs on
# localhost from roles/host_deploy; on an isolated network the check goes
# through the router.
# On the isolated network only the router can reach Garage, so the check
# runs there.

# Garage turns away unsigned requests with 403, which shows the S3 API
# is up without needing the key.
- name: Check the S3 API answers
  ansible.builtin.uri:
    url: "{{ garage_endpoint }}/"
    status_code: 403
  register: garage_check
  retries: 10
  delay: 3
  until: garage_check is succeeded
  delegate_to: "{{ final.via_router or 'localhost' }}"

- name: Show where Garage is
  ansible.builtin.debug:
    msg: >-
      {% if final.via_router -%}
      Garage is up on the isolated network at {{ garage_endpoint }}.
      {% set forward = vm.expose | selectattr('port', 'equalto', garage_s3_port | int) | first | default(none) -%}
      {% if forward -%}
      From home, S3 clients use http://{{ router_ip }}:{{ forward.wan_port }}.
      Redeploy the router if you just added this expose: entry.
      {%- else -%}
      To reach it from home, add expose: [{port: {{ garage_s3_port }}}] to
      {{ vm.name }} in networks/{{ vm.network.name }}.yaml and redeploy the
      router. S3 clients then use http://{{ router_ip }}:{{ garage_s3_port }}.
      {%- endif %}
      {%- else -%}
      Garage is up. S3 clients use endpoint {{ garage_endpoint }},
      region {{ garage_s3_region }}, path-style addressing, and access key
      {{ garage_key_id }} (secret in secrets/{{ vm.network.name }}/{{ vm.name }}.env).
      {%- endif %}
