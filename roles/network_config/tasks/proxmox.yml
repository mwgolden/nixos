# Checks the network files against what exists in Proxmox. Included from
# main.yml once the files themselves are valid.

- name: Check required environment variables
  ansible.builtin.assert:
    that:
      - lookup('env', 'PROXMOX_TOKEN_SECRET') | length > 0
    fail_msg: >-
      PROXMOX_TOKEN_SECRET is not set. Run 'source proxmox/.env' first, or
      pass -e network_config_check_proxmox=false to check only the files.
    quiet: true

- name: Read Proxmox
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      validate_certs: "{{ proxmox_validate_certs }}"
  block:
    - name: Look up VMs on the node
      community.proxmox.proxmox_vm_info:
        node: "{{ proxmox_node }}"
        type: qemu
      register: network_config_vms

    - name: Look up network interfaces on the node
      community.proxmox.proxmox_node_network_info:
        node: "{{ proxmox_node }}"
      register: network_config_ifaces

# A VM whose ID matches but whose name doesn't is someone else's VM. A VM
# whose name matches under another ID means the file has the wrong ID, and
# deploying would clone a second copy.
- name: Compare declared hosts with existing VMs
  ansible.builtin.set_fact:
    network_config_proxmox_errors: >-
      {{ network_configs | network_config_proxmox_errors(
           network_config_vms.proxmox_vms,
           network_config_ifaces.proxmox_node_networks,
           template_vm_id, proxmox_node) }}

- name: Report problems found in Proxmox
  ansible.builtin.fail:
    msg: "{{ ['The network files do not match Proxmox:'] + network_config_proxmox_errors }}"
  when: network_config_proxmox_errors | length > 0

- name: Show what exists
  ansible.builtin.debug:
    msg: "{{ network_configs | network_config_summary(network_config_vms.proxmox_vms) }}"
