# Checks the network files against what exists in Proxmox. Included from
# main.yml once the files themselves are valid.

- name: Check required environment variables
  ansible.builtin.assert:
    that:
      - lookup('env', 'PROXMOX_TOKEN_SECRET') | length > 0
    fail_msg: >-
      PROXMOX_TOKEN_SECRET is not set. Run 'source proxmox/.env' first, or
      pass -e network_config_check_proxmox=false to check only the files.
    quiet: true

- name: Read Proxmox
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      validate_certs: "{{ proxmox_validate_certs }}"
  block:
    # With their configuration: tags and notes say which VMs are the
    # project's (see network_config_ownership).
    - name: Look up VMs on the node
      community.proxmox.proxmox_vm_info:
        node: "{{ proxmox_node }}"
        type: qemu
        config: current
      register: network_config_vms

    - name: Look up network interfaces on the node
      community.proxmox.proxmox_node_network_info:
        node: "{{ proxmox_node }}"
      register: network_config_ifaces

    # Its CPU count and memory, for hosts' cores and memory_mb. Optional:
    # if the token can't read it, those checks are skipped.
    - name: Look up the node's size
      community.proxmox.proxmox_node_info:
      register: network_config_nodes
      failed_when: false

# A VM whose ID matches but whose name doesn't is someone else's VM. A VM
# whose name matches under another ID means the file has the wrong ID, and
# deploying would clone a second copy.
- name: Note the node's size
  ansible.builtin.set_fact:
    network_config_node: >-
      {{ (network_config_nodes.proxmox_nodes | default([])
          | selectattr('node', 'equalto', proxmox_node) | list + [{}]) | first }}

- name: Compare declared hosts with existing VMs
  ansible.builtin.set_fact:
    network_config_proxmox_errors: >-
      {{ network_configs | network_config_proxmox_errors(
           network_config_vms.proxmox_vms,
           network_config_ifaces.proxmox_node_networks,
           template_vm_id, proxmox_node)
         + (network_configs | network_config_capacity_errors(network_config_node.maxcpu | default(0))) }}

- name: Report problems found in Proxmox
  ansible.builtin.fail:
    msg: "{{ ['The network files do not match Proxmox:'] + network_config_proxmox_errors }}"
  when: network_config_proxmox_errors | length > 0

- name: Check the hosts' memory against the node
  ansible.builtin.set_fact:
    network_config_capacity_warnings: >-
      {{ network_configs | network_config_capacity_warnings(
           network_config_vms.proxmox_vms, network_config_node.maxmem | default(0),
           template_memory_mb) }}

- name: Show the memory warning
  ansible.builtin.debug:
    msg: "{{ ['Warning (deploys still go ahead):'] + network_config_capacity_warnings }}"
  when: network_config_capacity_warnings | length > 0

- name: Show the node's size
  ansible.builtin.debug:
    msg: "Could not read the size of node {{ proxmox_node }}, so cores and memory_mb weren't checked against it."
  when: network_config_node.maxcpu is not defined

- name: Show what exists
  ansible.builtin.debug:
    msg: "{{ network_configs | network_config_summary(network_config_vms.proxmox_vms) }}"
