# Path of the KEY=value file to read. Required.
dotenv_path: ""

# Added to the error when the file is missing, to say how to create it.
dotenv_missing_hint: "Copy .env.example next to it to .env and fill it in."

# Fail when the file is missing. With false, a missing file gives an empty
# dotenv_values; dotenv_file.stat.exists tells the two apart.
dotenv_required: true
