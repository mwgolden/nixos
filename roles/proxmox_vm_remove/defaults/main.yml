# VM ID and name. Required. The VM is only deleted if its name matches.
vm_remove_id: ""
vm_remove_name: ""

# What the person typed to confirm. Must equal vm_remove_name. Playbooks
# ask for it with vars_prompt, or take it from -e confirm_destroy=<name>.
vm_remove_confirm: ""

# Addresses whose SSH host keys are forgotten afterwards, so a future VM on
# them is trusted afresh.
vm_remove_known_hosts: []
