# Installs the configuration every VM shares: /etc/nixos/common.nix and
# /etc/nixos/network.nix, and formats the data disk if there is one. The
# host's own configuration.nix goes next to them, then tasks_from: switch
# builds and switches to it.
#
# Runs on a VM placed by placement.yml and checked by identity.yml (it
# needs final), with become: true.

- name: Wait for login
  ansible.builtin.wait_for_connection:
    timeout: 120

- name: Prepare the data disk
  when: nixos_base_data_disk_serial | length > 0
  vars:
    nixos_base_data_disk_device: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_{{ nixos_base_data_disk_serial }}"
  block:
    - name: Wait for the data disk to appear
      ansible.builtin.wait_for:
        path: "{{ nixos_base_data_disk_device }}"
        timeout: 60

    # Only formats a disk with no filesystem, so existing data is never
    # wiped. On a disk that was grown, it grows the filesystem to match.
    - name: Format data disk
      community.general.filesystem:
        dev: "{{ nixos_base_data_disk_device }}"
        fstype: ext4
        resizefs: true

# Rendering fills in the deployment SSH public key.
- name: Install common NixOS configuration
  ansible.builtin.template:
    src: "{{ role_path }}/../../modules/common.nix"
    dest: /etc/nixos/common.nix
    mode: "0644"

- name: Install network configuration
  ansible.builtin.template:
    src: "{{ role_path }}/../../modules/network.nix.j2"
    dest: /etc/nixos/network.nix
    mode: "0644"
  vars:
    host_name: "{{ nixos_base_hostname }}"
    host_ip: "{{ final.ip }}"
    host_prefix_length: "{{ final.prefix_length }}"
    host_gateway: "{{ final.gateway }}"
    host_nameserver: "{{ final.nameserver }}"

- name: Note the network's security settings
  ansible.builtin.set_fact:
    nixos_base_security: "{{ nixlab | network_security(vm.network.name) }}"
    nixos_base_host_cert: false

- name: Get an SSH host certificate
  ansible.builtin.include_tasks: host-cert.yml
  when: nixos_base_security.administrative_identity.ssh_host_ca | bool

# A TLS certificate from the network's PKI, and trust in its root, when
# the network's security.pki is {provider: openbao}
# (docs/plans/completed/INTERNAL-CA.md). pki-trust.nix (imported by common.nix) adds
# the root to the VM's trusted certificates; { } otherwise.
- name: Note where this host's TLS certificate comes from
  ansible.builtin.set_fact:
    nixos_base_pki: "{{ nixlab | host_pki(vm) }}"
    nixos_base_tls_cert: false
    nixos_base_tls_changed: false
    # As a fact, so the host type's own role (proxy, openbao) can use it.
    nixos_base_tls_dir: "{{ nixos_base_tls_dir }}"

- name: Get a TLS certificate
  ansible.builtin.include_tasks: tls-cert.yml
  when: nixos_base_pki | length > 0

- name: Look for the root certificate
  ansible.builtin.stat:
    path: "{{ role_path }}/../../{{ nixos_base_pki.root_file }}"
  register: nixos_base_pki_root_stat
  delegate_to: localhost
  become: false
  when: nixos_base_pki | length > 0

- name: Note whether this host trusts a root
  ansible.builtin.set_fact:
    nixos_base_pki_root: "{{ nixos_base_pki | length > 0 and nixos_base_pki_root_stat.stat.exists | default(false) }}"

- name: Install the root certificate
  ansible.builtin.copy:
    src: "{{ role_path }}/../../{{ nixos_base_pki.root_file }}"
    dest: /etc/nixos/nixlab-root.crt
    mode: "0644"
  when: nixos_base_pki_root | bool

- name: Install TLS trust
  ansible.builtin.template:
    src: pki-trust.nix.j2
    dest: /etc/nixos/pki-trust.nix
    mode: "0644"

# Which SSH user CA this host trusts, and its host certificate, from its
# network's security: block. Empty ({ }) with static keys only. common.nix
# imports it.
- name: Install SSH certificate trust
  ansible.builtin.template:
    src: ssh-trust.nix.j2
    dest: /etc/nixos/ssh-trust.nix
    mode: "0644"
  vars:
    nixos_base_ca_instance: "{{ nixos_base_security.administrative_identity.instance }}"
    nixos_base_ca_file: >-
      {{ role_path }}/../../secrets/{{ nixos_base_ca_instance | replace('.', '/', 1) }}-ssh-user-ca.pub
    nixos_base_ssh_trust:
      instance: "{{ nixos_base_ca_instance }}"
      ca_key: >-
        {{ (lookup('ansible.builtin.file', nixos_base_ca_file, errors='ignore') or '') | trim
           if nixos_base_ca_instance else '' }}
      principals: "{{ nixos_base_security | ssh_trust_principals(nixos_base_operator_user) }}"

- name: Say the SSH user CA isn't deployed yet
  ansible.builtin.debug:
    msg: >-
      Network {{ vm.network.name }} trusts the SSH user CA of {{ nixos_base_ca_instance }},
      but secrets/{{ nixos_base_ca_instance | replace('.', '/', 1) }}-ssh-user-ca.pub
      doesn't exist yet, so {{ vm.name }} accepts static keys only for now.
      Deploy {{ nixos_base_ca_instance }} (with settings.ssh_user_ca: true),
      then this host again.
  vars:
    nixos_base_ca_instance: "{{ (nixlab | network_security(vm.network.name)).administrative_identity.instance }}"
  when: >-
    nixos_base_ca_instance | length > 0 and not
    (role_path ~ '/../../secrets/' ~ (nixos_base_ca_instance | replace('.', '/', 1)) ~ '-ssh-user-ca.pub') is file

# ---- This host's read-only OpenBao token ----
# Made by its network's openbao host (roles/openbao, tokens.yml) in
# secrets/<network>/<host>-read-token, and put here, root-only, outside
# the Nix store. openbao-client.nix (imported by common.nix) adds the bao
# CLI, the address and a daily renewal.

- name: Note this host's OpenBao token
  ansible.builtin.set_fact:
    nixos_base_bao_store: "{{ nixlab | network_secrets_store(vm.network.name) }}"
    nixos_base_bao_token_file: "{{ role_path }}/../../secrets/{{ vm.network.name }}/{{ vm.name }}-read-token"

- name: Look for this host's OpenBao token
  ansible.builtin.stat:
    path: "{{ nixos_base_bao_token_file }}"
  register: nixos_base_bao_token_stat
  delegate_to: localhost
  become: false

- name: Note whether this host gets an OpenBao token
  ansible.builtin.set_fact:
    nixos_base_bao_client: >-
      {{ nixos_base_bao_store | length > 0 and vm.type not in ['router', 'openbao']
         and nixos_base_bao_token_stat.stat.exists }}

- name: Make /etc/openbao
  ansible.builtin.file:
    path: /etc/openbao
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nixos_base_bao_client | bool

- name: Install this host's OpenBao token
  ansible.builtin.copy:
    src: "{{ nixos_base_bao_token_file }}"
    dest: "/etc/openbao/{{ vm.name }}.token"
    owner: root
    group: root
    mode: "0400"
  when: nixos_base_bao_client | bool
  no_log: true

- name: Install OpenBao's certificate
  ansible.builtin.copy:
    src: "{{ role_path }}/../../{{ nixos_base_bao_store.ca_file }}"
    dest: /etc/openbao/ca.crt
    mode: "0644"
  when: nixos_base_bao_client | bool and nixos_base_bao_store.ca_file | length > 0

- name: Remove a token this host no longer has
  ansible.builtin.file:
    path: "/etc/openbao/{{ vm.name }}.token"
    state: absent
  when: not nixos_base_bao_client | bool

- name: Install the OpenBao client configuration
  ansible.builtin.template:
    src: openbao-client.nix.j2
    dest: /etc/nixos/openbao-client.nix
    mode: "0644"
