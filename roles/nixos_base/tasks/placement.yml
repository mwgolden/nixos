# Finds a VM on whichever network it is on now, works out where it should
# end up, and adds it to the inventory as place_alias with everything
# switch.yml needs to move it there.
#
# A VM is either on the home network (vmbr0, its home IP) or on the
# isolated network (the router's LAN, its isolated IP). Machines on the
# isolated network are reached over SSH through the router.
#
# Run with include_role (name: nixos_base, tasks_from: placement) from a play
# on localhost that has the Proxmox module_defaults and loads
# proxmox/vars.yaml and hosts/router/vars.yaml. Set:
#   place_alias        inventory name to add the VM as
#   place_vm_id        Proxmox VM ID
#   place_vm_name      VM name, used in messages
#   place_home_ip      the VM's address on the home network
#   place_isolated_ip  the VM's address on the isolated network
#   place_network      where it should end up: home or isolated
#   place_new_clone    true if the VM was just cloned from the template
#   place_net0         the VM's current net0 setting from Proxmox
#                      ("virtio=...,bridge=vmbr0"), or '' for a new clone

- name: Check the network setting
  ansible.builtin.assert:
    that:
      - place_network in ['home', 'isolated']
    fail_msg: >-
      {{ place_vm_name }}_network must be 'home' or 'isolated', not
      '{{ place_network }}'.
    quiet: true

- name: Read which bridge the VM is on
  ansible.builtin.set_fact:
    place_bridge: >-
      {{ (place_net0 | regex_search('bridge=([^,]+)', '\1') or [network_bridge]) | first }}
    place_ssh_direct: "-o StrictHostKeyChecking=accept-new"
    # The deployment key logs in to the router too. The inner ssh needs it
    # given explicitly; -i on the outer command doesn't reach it.
    place_ssh_via_router: >-
      -o StrictHostKeyChecking=accept-new
      -o ProxyCommand="ssh -i '{{ lookup('env', 'NIXOS_DEPLOYMENT_PRIVATE_KEY') }}'
      -o StrictHostKeyChecking=accept-new -o BatchMode=yes
      -W %h:%p admin@{{ router_ip }}"

# The router is the way into the isolated network, both to reach a VM there
# and to fall back to if the VM isn't found on the home network.
- name: Check whether the router answers
  ansible.builtin.wait_for:
    host: "{{ router_ip }}"
    port: 22
    timeout: 5
  register: place_router_check
  ignore_errors: true

- name: Require the router for the isolated network
  ansible.builtin.assert:
    that:
      - place_router_check is succeeded
    fail_msg: >-
      {{ place_vm_name }} is or will be on the isolated network, but the
      router ({{ router_ip }}) isn't answering. Deploy it first:
      ansible-playbook hosts/router/router.yaml
    quiet: true
  when: place_network == 'isolated' or place_bridge == isolated_bridge

- name: Add router to inventory
  ansible.builtin.add_host:
    name: router
    ansible_host: "{{ router_ip }}"
    ansible_user: admin
    ansible_ssh_private_key_file: "{{ lookup('env', 'NIXOS_DEPLOYMENT_PRIVATE_KEY') }}"
    ansible_ssh_common_args: "{{ place_ssh_direct }}"
  when: place_router_check is succeeded

- name: Check the isolated address
  when: place_network == 'isolated'
  block:
    # Expected: "10.1.0.11 dev ens19 src 10.1.0.1 ...". Anything else means
    # the address is the router itself or not on the isolated LAN.
    - name: Ask the router where the isolated address is
      ansible.builtin.command:
        cmd: ip -4 route get {{ place_isolated_ip }}
      register: place_isolated_route
      changed_when: false
      delegate_to: router

    - name: Require the isolated address to be on the LAN, outside the DHCP range
      ansible.builtin.assert:
        that:
          - place_isolated_route.stdout is match('^' ~ (place_isolated_ip | regex_escape) ~ ' dev ens19 ')
          - not (dhcp_start <= address <= dhcp_end)
        fail_msg: >-
          {{ place_vm_name }}_isolated_ip ({{ place_isolated_ip }}) must be an
          address on the isolated LAN ({{ router_lan_ip }}/{{ router_lan_prefix_length }}),
          other than the router's, and outside the DHCP range
          {{ router_dhcp_range_start }}-{{ router_dhcp_range_end }}.
        quiet: true
      vars:
        address: "{{ place_isolated_ip | split('.') | map('int') | list }}"
        dhcp_start: "{{ router_dhcp_range_start | split('.') | map('int') | list }}"
        dhcp_end: "{{ router_dhcp_range_end | split('.') | map('int') | list }}"

# A new clone is always on the template's address on the home network. An
# existing VM is looked for where its bridge says it should be (its own IP,
# or the template IP if a first deploy was interrupted). If it isn't there,
# it is looked for on the other network, in case an earlier move was
# interrupted between changing its address and moving its network card.
- name: List the places to look for the VM
  ansible.builtin.set_fact:
    place_candidates: >-
      {{ new_clone if place_new_clone | bool
         else (isolated + home) if place_bridge == isolated_bridge
         else home + (isolated if place_router_check is succeeded else []) }}
  vars:
    new_clone:
      - { ip: "{{ template_ip }}", bridge: "{{ network_bridge }}", via_router: false, delay: 5, timeout: 300 }
    home:
      - { ip: "{{ place_home_ip }}", bridge: "{{ network_bridge }}", via_router: false, delay: 0, timeout: 60 }
      - { ip: "{{ template_ip }}", bridge: "{{ network_bridge }}", via_router: false, delay: 0, timeout: 20 }
    isolated:
      - { ip: "{{ place_isolated_ip }}", bridge: "{{ isolated_bridge }}", via_router: true, delay: 0, timeout: 60 }

- name: Start looking
  ansible.builtin.set_fact:
    place_found: false

- name: Look for the VM
  ansible.builtin.include_tasks: placement-try.yml
  loop: "{{ place_candidates }}"
  loop_control:
    loop_var: candidate
    label: "{{ candidate.ip }} on {{ candidate.bridge }}"

- name: Require the VM to be found
  ansible.builtin.assert:
    that:
      - place_found
    fail_msg: >-
      {{ place_vm_name }} (VM {{ place_vm_id }}) didn't answer SSH at
      {{ place_candidates | map(attribute='ip') | join(', ') }}. Check in
      Proxmox that it is running and which bridge net0 is on.
    quiet: true

- name: Work out where the VM ends up
  ansible.builtin.set_fact:
    place_final: >-
      {{ isolated if place_network == 'isolated' else home }}
  vars:
    home:
      ip: "{{ place_home_ip }}"
      bridge: "{{ network_bridge }}"
      via_router: false
      prefix_length: "{{ network_prefix_length }}"
      gateway: "{{ network_gateway }}"
      nameserver: "{{ network_nameserver }}"
    isolated:
      ip: "{{ place_isolated_ip }}"
      bridge: "{{ isolated_bridge }}"
      via_router: true
      prefix_length: "{{ router_lan_prefix_length }}"
      gateway: "{{ router_lan_ip }}"
      nameserver: "{{ router_lan_ip }}"

# A new clone has the template's host key, which may differ from the key
# recorded for its final address by a VM that used it before.
- name: Forget old SSH host key for the VM's final address
  ansible.builtin.known_hosts:
    name: "{{ place_final.ip }}"
    state: absent
  when: place_new_clone | bool

- name: Add VM to inventory
  ansible.builtin.add_host:
    name: "{{ place_alias }}"
    ansible_host: "{{ place_connect.ip }}"
    ansible_user: admin
    ansible_ssh_private_key_file: "{{ lookup('env', 'NIXOS_DEPLOYMENT_PRIVATE_KEY') }}"
    ansible_ssh_common_args: >-
      {{ place_ssh_via_router if place_connect.via_router else place_ssh_direct }}
    vm_id: "{{ place_vm_id }}"
    connect: "{{ place_connect }}"
    final: "{{ place_final }}"
    ssh_direct: "{{ place_ssh_direct }}"
    ssh_via_router: "{{ place_ssh_via_router }}"

- name: Show where the VM is and where it goes
  ansible.builtin.debug:
    msg: >-
      {{ place_vm_name }} found at {{ place_connect.ip }} on
      {{ place_connect.bridge }}{{ ' (through the router)' if place_connect.via_router else '' }}.
      {% if place_connect.ip == place_final.ip %}It stays there.{% else %}It
      moves to {{ place_final.ip }} on {{ place_final.bridge }} ({{ place_network }} network).{% endif %}
