# Host name written to /etc/nixos/network.nix. Required for main.yml.
nixos_base_hostname: ""

# Serial of a data disk to format before the configuration is switched, or
# '' for none. Matches proxmox_vm_data_disk.serial in the proxmox_vm role.
nixos_base_data_disk_serial: ""

# The workstation's user, whose principals come from the network's
# administrative_identity.principals.operator. '' on other host types.
nixos_base_operator_user: ""

# A host certificate with fewer days left than this is renewed on deploy.
nixos_base_host_cert_renew_days: 30
