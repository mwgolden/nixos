# Creates database users on a postgres host, makes sure their schemas exist,
# and grants each user the access levels and roles listed in the host's
# settings (users_database, schemas and users) in its network file.
# Safe to re-run: it brings the server in line with the settings each time.
# See roles/postgres/USERS.md.
#
# Deploying the host already does this. Use this playbook to apply a change
# to the users without a full deploy:
#
#   source proxmox/.env
#   ansible-playbook playbooks/postgres-users.yaml -e network=lab -e host=postgres
#
# To list the access levels and the roles that exist on the server:
#   ansible-playbook playbooks/postgres-users.yaml -e network=lab -e host=postgres --tags list
#
# The admin login is read from secrets/<network>/<host>.env and the users'
# passwords from secrets/<network>/<host>-users.env.

- name: Prepare database users
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../proxmox/vars.yaml

  tasks:
    - name: Check the arguments
      ansible.builtin.assert:
        that:
          - network | default('') | length > 0
          - host | default('') | length > 0
        fail_msg: "Run with -e network=<file in networks/> -e host=<postgres host name>."
        quiet: true
      tags: [always]

    - name: Load the network files
      ansible.builtin.include_role:
        name: network_config
        apply:
          tags: [always]
      vars:
        network_config_name: "{{ network }}"
        network_config_check_proxmox: false
      tags: [always]

    - name: Find the postgres host
      ansible.builtin.set_fact:
        nixlab: "{{ network_configs | network_config_inventory }}"
      tags: [always]

    - name: Require a postgres host in that network
      ansible.builtin.assert:
        that:
          - host in nixlab.hosts
          - nixlab.hosts[host].type == 'postgres'
          - nixlab.hosts[host].network.name == network
        fail_msg: "networks/{{ network }}.yaml has no postgres host named '{{ host }}'."
        quiet: true
      tags: [always]

    - name: Check required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', 'NIXOS_DEPLOYMENT_PRIVATE_KEY') | length > 0
        fail_msg: "NIXOS_DEPLOYMENT_PRIVATE_KEY is not set. Run 'source proxmox/.env' first."
        quiet: true
      tags: [always]

    - name: Note the host
      ansible.builtin.set_fact:
        vm: "{{ nixlab.hosts[host] }}"
      tags: [always]

    - name: Require users_database
      ansible.builtin.assert:
        that:
          - vm.settings.users_database | default('') | length > 0
        fail_msg: "Set settings.users_database of {{ host }} in networks/{{ network }}.yaml."
        quiet: true
      tags: [always]

    # The same checks a deploy runs: the admin login, then the users settings
    # and passwords.
    - name: Read and check the settings
      ansible.builtin.include_role:
        name: postgres
        tasks_from: prepare
        apply:
          tags: [always]
      tags: [always]

    # On an isolated network the VM is reached over SSH through the router.
    - name: Add the postgres VM to inventory
      ansible.builtin.add_host:
        name: "{{ host }}"
        ansible_host: "{{ vm.ip }}"
        ansible_user: admin
        ansible_ssh_private_key_file: "{{ key }}"
        ansible_ssh_common_args: "{{ router_wan | nixlab_ssh_args(key) }}"
        vm: "{{ vm }}"
        nixlab: "{{ nixlab }}"
      vars:
        router_wan: "{{ nixlab.networks[network].router_wan_ip if vm.network.type == 'isolated' else '' }}"
        key: "{{ lookup('env', 'NIXOS_DEPLOYMENT_PRIVATE_KEY') }}"
      tags: [always]

- name: Apply database users
  hosts: "{{ host }}"
  gather_facts: false
  become: true

  vars:
    postgres_admin_user: "{{ hostvars['localhost'].postgres_admin_user }}"
    postgres_users_list: "{{ hostvars['localhost'].postgres_users_list }}"
    postgres_users_schemas: "{{ hostvars['localhost'].postgres_users_schemas }}"
    postgres_users_group_prefix: "{{ hostvars['localhost'].postgres_users_group_prefix }}"
    postgres_users_passwords: "{{ hostvars['localhost'].postgres_users_passwords }}"

  tasks:
    - name: Apply the users
      ansible.builtin.import_role:
        name: postgres
        tasks_from: users-apply
