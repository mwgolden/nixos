# Stops and permanently deletes one host's VM, including its data disk and
# everything on it. Asks you to type the host name to confirm.
#
#   source proxmox/.env
#   ansible-playbook playbooks/destroy-host.yaml -e network=lab -e host=postgres
#
# To skip the prompt (for scripts): -e confirm_destroy=<host name>
#
# The host's entry stays in its network file; remove it there too, or the
# next deploy creates it again. A router can't be deleted while other VMs
# of its network still exist, since they would lose their only way out.
# An openbao host holds the other hosts' secrets (see secrets/README.md):
# before deleting it, the hosts whose .env file is gone are listed, since
# their secrets go with it, and a snapshot is saved to
# secrets/<network>/backups/ (-e openbao_skip_backup=true to delete without).
# Any other host's read-only OpenBao token is revoked; its secrets stay.
# Only VMs tagged as the project's for this network (nixlab, net-<network>)
# are deleted; deploying a VM tags it. Afterwards the network's diagram in
# docs/network-diagrams/ shows the host as not deployed.

- name: Destroy a host
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../proxmox/vars.yaml

  vars_prompt:
    - name: confirm_destroy
      prompt: "This permanently deletes the VM named by -e host, with all its disks and data (for an openbao host: every secret in it, including the other hosts' imported ones). Type the host name to confirm"
      private: false

  tasks:
    - name: Check the arguments
      ansible.builtin.assert:
        that:
          - network | default('') | length > 0
          - host | default('') | length > 0
        fail_msg: "Run with -e network=<file in networks/> -e host=<host name>."
        quiet: true

    # The Proxmox checks are skipped: a VM in an odd state should still be
    # deletable. proxmox_vm_remove checks the VM's name itself.
    - name: Load the network files
      ansible.builtin.include_role:
        name: network_config
      vars:
        network_config_name: "{{ network }}"
        network_config_check_proxmox: false

    - name: Find the host
      ansible.builtin.set_fact:
        destroy_inventory: "{{ network_configs | network_config_inventory }}"

    - name: Require the host in that network
      ansible.builtin.assert:
        that:
          - (network ~ '.' ~ host) in destroy_inventory.hosts
        fail_msg: "networks/{{ network }}.yaml has no host named '{{ host }}'."
        quiet: true

    - name: Note the host
      ansible.builtin.set_fact:
        destroy_vm: "{{ destroy_inventory.hosts[network ~ '.' ~ host] }}"

    - name: Check no VMs still depend on the router
      when: destroy_vm.type == 'router'
      module_defaults:
        group/community.proxmox.proxmox:
          api_host: "{{ proxmox_api_host }}"
          api_user: "{{ proxmox_api_user }}"
          api_token_id: "{{ proxmox_api_token_id }}"
          api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
          validate_certs: "{{ proxmox_validate_certs }}"
      block:
        - name: Look up VMs on the node
          community.proxmox.proxmox_vm_info:
            node: "{{ proxmox_node }}"
            type: qemu
          register: destroy_node_vms

        - name: Refuse while other VMs of the network exist
          ansible.builtin.assert:
            that:
              - dependents | length == 0
            fail_msg: >-
              {{ host }} is the router of network {{ network }}, and these of its
              VMs still exist: {{ dependents | join(', ') }}. Destroy them first.
            quiet: true
          vars:
            existing_ids: "{{ destroy_node_vms.proxmox_vms | map(attribute='vmid') | map('int') | list }}"
            dependents: >-
              {{ destroy_inventory.hosts.values()
                 | selectattr('network.name', 'equalto', network)
                 | rejectattr('name', 'equalto', host)
                 | selectattr('vm_id', 'in', existing_ids)
                 | map(attribute='name') | list }}

    - name: Say which hosts' secrets go with the OpenBao
      when: destroy_vm.type == 'openbao'
      block:
        - name: Look for the other hosts' secrets files
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/../secrets/{{ network }}/{{ item.name }}.env"
          loop: "{{ destroy_inventory.hosts.values() | selectattr('network.name', 'equalto', network)
                    | selectattr('type', 'in', ['gitea', 'postgres', 'garage', 'ldap', 'nats', 'monitoring', 'workstation'])
                    | list }}"
          loop_control:
            label: "{{ item.name }}"
          register: destroy_secrets_files

        - name: Warn about secrets only in OpenBao
          ansible.builtin.debug:
            msg: >-
              {{ host }} holds the secrets of {{ network }}'s hosts. These have
              no secrets/{{ network }}/<host>.env any more, so deleting it loses
              their secrets: {{ missing | join(', ') }}. Save them first with
              bao kv get, or Ctrl-C now.
          vars:
            missing: "{{ destroy_secrets_files.results | rejectattr('stat.exists') | map(attribute='item.name') | list }}"
          when: missing | length > 0

    # Over SSH, through the router on an isolated network.
    - name: Add the VM and its router to the inventory
      ansible.builtin.add_host:
        name: "{{ item.id }}"
        ansible_host: "{{ item.attach.ip }}"
        ansible_user: admin
        ansible_ssh_private_key_file: "{{ key }}"
        ansible_ssh_common_args: >-
          {{ (destroy_inventory.networks[item.attach.network].router_wan_ip if item.attach.via_router else '')
             | nixlab_ssh_args(key) }}
      loop: >-
        {{ [destroy_vm] + ([destroy_inventory.hosts[destroy_vm.network.router_id]]
                           if destroy_vm.network.router_id and destroy_vm.type != 'router' else []) }}
      loop_control:
        label: "{{ item.id }}"
      vars:
        key: "{{ lookup('env', 'NIXOS_DEPLOYMENT_PRIVATE_KEY') }}"

    # Deleting the VM deletes everything OpenBao stores. -e
    # openbao_skip_backup=true deletes it without (a VM that won't start).
    - name: Back up the OpenBao first
      when: destroy_vm.type == 'openbao' and not (openbao_skip_backup | default(false) | bool)
      block:
        - name: Save a snapshot of {{ host }}
          ansible.builtin.include_role:
            name: openbao
            tasks_from: backup
            apply:
              delegate_to: "{{ destroy_vm.id }}"
              become: true
          vars:
            vm: "{{ destroy_vm }}"
            nixlab: "{{ destroy_inventory }}"
      rescue:
        - name: Stop without a backup
          ansible.builtin.fail:
            msg: >-
              Couldn't save a snapshot of {{ host }}'s OpenBao, so nothing was
              deleted. If it can't be reached any more and you accept losing
              what it stores, run again with -e openbao_skip_backup=true.

    # The token ends with the host. Its secret stays, as its .env file does.
    - name: Revoke the host's read-only OpenBao token
      when: destroy_vm.type not in ['router', 'openbao']
      vars:
        destroy_store: "{{ destroy_inventory | network_secrets_store(network) }}"
        destroy_token_file: "{{ playbook_dir }}/../secrets/{{ network }}/{{ host }}-read-token"
        destroy_via: "{{ destroy_store.via_router | default('') or 'localhost' }}"
        destroy_ca: >-
          {{ '' if not destroy_store.ca_file | default('')
             else ('/tmp/nixlab-' ~ destroy_store.host_id ~ '-tls.crt') if destroy_store.via_router
             else (playbook_dir ~ '/../' ~ destroy_store.ca_file) }}
      block:
        - name: Look for the host's token
          ansible.builtin.stat:
            path: "{{ destroy_token_file }}"
          register: destroy_token

        - name: Copy OpenBao's certificate to the router
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../{{ destroy_store.ca_file }}"
            dest: "{{ destroy_ca }}"
            mode: "0644"
          delegate_to: "{{ destroy_via }}"
          when: destroy_token.stat.exists and destroy_ca | length > 0 and destroy_store.via_router | length > 0

        - name: Revoke the token
          ansible.builtin.uri:
            url: "{{ destroy_store.url }}/v1/auth/token/revoke-self"
            method: POST
            headers:
              X-Vault-Token: "{{ lookup('ansible.builtin.file', destroy_token_file) | trim }}"
            ca_path: "{{ destroy_ca or omit }}"
            status_code: [200, 204]
          register: destroy_revoked
          failed_when: false
          delegate_to: "{{ destroy_via }}"
          no_log: true
          when: destroy_token.stat.exists and destroy_store | length > 0

        - name: Say the token couldn't be revoked
          ansible.builtin.debug:
            msg: >-
              Couldn't revoke {{ host }}'s read-only token in OpenBao
              ({{ destroy_revoked.status | default('-') }}). It is still valid
              until it expires (768h after its last renewal). Revoke it by hand:
              bao token revoke $(cat secrets/{{ network }}/{{ host }}-read-token)
          when: destroy_token.stat.exists and destroy_revoked.status | default(-1) not in [200, 204]

        - name: Delete the token file
          ansible.builtin.file:
            path: "{{ destroy_token_file }}"
            state: absent
          when: destroy_token.stat.exists and destroy_revoked.status | default(-1) in [200, 204]

    - name: Delete the VM
      ansible.builtin.include_role:
        name: proxmox_vm_remove
      vars:
        vm_remove_id: "{{ destroy_vm.vm_id }}"
        vm_remove_name: "{{ destroy_vm.name }}"
        vm_remove_confirm: "{{ confirm_destroy }}"
        vm_remove_required_tags: [nixlab, "net-{{ network }}"]
        # A future VM on this address gets a new host key.
        vm_remove_known_hosts:
          - "{{ destroy_vm.attach.ip }}"

    - name: Rewrite the network's diagram
      ansible.builtin.include_role:
        name: network_config
        tasks_from: diagram
      vars:
        network_diagram_networks: ["{{ network }}"]
