# Shared settings for the template bootstrap playbooks.

proxmox_api_host: "proxmox.home.lan"
proxmox_api_user: "ansible@pve"
proxmox_api_token_id: "automation"
proxmox_validate_certs: false
proxmox_node: "com"

# Proxmox storage that holds uploaded ISOs
iso_storage: "local"

template_vm_id: 110
template_vm_name: "nixos-template"
# A new VM starts with these, unless its host sets memory_mb or cores.
template_memory_mb: 4096
template_cores: 2

# CPU type for every VM, and the template, unless a host's cpu: in its
# network file says otherwise. One of x86-64-v2-AES, x86-64-v2 or host.
# Proxmox's default, kvm64, lacks SSE4.2, which software such as Claude Code
# needs; this node has no AVX2, so x86-64-v3 and v4 won't start. A change
# reaches an existing VM on its next deploy, and takes effect once it is
# stopped and started (-e proxmox_vm_restart=true). See networks/README.md#cpu-type-cores-and-memory.
vm_cpu_type: x86-64-v2-AES
template_disk_size_gb: 20
template_disk_storage: "local-lvm"
network_bridge: "vmbr0"

# Default bridge for scripts/isolated-bridge.yaml when run without
# -e bridge=. Deploys use each network file's own bridge instead.
isolated_bridge: "vmbr1"

# The installer ISO and the installed template both use this address.
# They run on the same VM, never at the same time.
template_ip: "192.168.1.10"
network_prefix_length: 24
network_gateway: "192.168.1.1"
network_nameserver: "192.168.1.1"

install_disk: "/dev/sda"
