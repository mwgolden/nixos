# Creates an isolated bridge on the Proxmox node: a Linux bridge with no
# physical port and no IP on the Proxmox host. Deploying a router (with
# playbooks/deploy-host.yaml or deploy-network.yaml) does this for its
# network's bridge already; this playbook is for doing it on its own.
# Safe to re-run: an existing isolated bridge is left as it is.
#
#   source proxmox/.env
#   ansible-playbook proxmox/scripts/isolated-bridge.yaml                   # isolated_bridge from ../vars.yaml
#   ansible-playbook proxmox/scripts/isolated-bridge.yaml -e bridge=vmbr2
#
# Applying network changes in Proxmox applies every staged change on the
# node, not only this bridge. The playbook stops if other changes are already
# staged (for example, unsaved edits in the web UI). Pass
# -e isolated_bridge_apply_pending=true to apply them along with the bridge.

- name: Create an isolated bridge
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars.yaml

  tasks:
    - name: Make sure the bridge exists
      ansible.builtin.include_role:
        name: isolated_bridge
      vars:
        isolated_bridge_name: "{{ bridge | default(isolated_bridge) }}"
