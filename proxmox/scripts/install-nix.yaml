# Installs NixOS onto VM 110 from the running installer ISO, checks that the
# installed system boots, then converts the VM into a template.

- name: Connect to the NixOS installer
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars.yaml

  tasks:
    # The installer and the installed system share one IP but have different
    # host keys, so drop whatever key was recorded for it last time.
    - name: Forget old SSH host key for the template IP
      ansible.builtin.known_hosts:
        name: "{{ template_ip }}"
        state: absent

    - name: Wait for installer SSH
      ansible.builtin.wait_for:
        host: "{{ template_ip }}"
        port: 22
        delay: 5
        timeout: 600

    - name: Add installer to Ansible inventory
      ansible.builtin.add_host:
        name: nixos-installer
        groups: installer
        ansible_host: "{{ template_ip }}"
        ansible_user: root
        ansible_ssh_private_key_file: "{{ lookup('env', 'NIXOS_INSTALLER_KEY') }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

- name: Install NixOS
  hosts: installer
  gather_facts: false
  vars_files:
    - ../vars.yaml

  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      validate_certs: "{{ proxmox_validate_certs }}"

  tasks:
    - name: Wait for installer login
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Verify installation disk
      ansible.builtin.assert:
        that:
          - install_disk == "/dev/sda"
        fail_msg: "Refusing to partition unexpected disk: {{ install_disk }}"

    - name: Create BIOS boot partition
      community.general.parted:
        device: "{{ install_disk }}"
        number: 1
        label: gpt
        part_start: "1MiB"
        part_end: "2MiB"
        flags:
          - bios_grub
        state: present

    - name: Create root partition
      community.general.parted:
        device: "{{ install_disk }}"
        number: 2
        label: gpt
        part_start: "2MiB"
        part_end: "100%"
        state: present

    - name: Format root partition
      community.general.filesystem:
        dev: "{{ install_disk }}2"
        fstype: ext4

    - name: Mount root file system
      ansible.posix.mount:
        path: /mnt
        src: "{{ install_disk }}2"
        fstype: ext4
        state: ephemeral

    - name: Generate hardware configuration
      ansible.builtin.command:
        cmd: nixos-generate-config --root /mnt

    # Rendering fills in the deployment SSH public key.
    - name: Install common NixOS configuration
      ansible.builtin.template:
        src: ../../modules/common.nix
        dest: /mnt/etc/nixos/common.nix
        mode: "0644"

    - name: Create NixOS configuration
      ansible.builtin.copy:
        dest: /mnt/etc/nixos/configuration.nix
        mode: "0644"
        content: |
          { config, lib, pkgs, ... }:

          {
            imports = [
              ./hardware-configuration.nix
              ./common.nix
            ];

            networking.interfaces.ens18.ipv4.addresses = [{
              address = "{{ template_ip }}";
              prefixLength = {{ network_prefix_length }};
            }];

            networking.defaultGateway = "{{ network_gateway }}";

            networking.nameservers = [
              "{{ network_nameserver }}"
            ];
          }

    - name: Enable Nix experimental features
      ansible.builtin.copy:
        dest: /etc/nix/nix.conf
        mode: "0644"
        content: |
          experimental-features = nix-command flakes

    # Without HOME=/root, nixos-install fails under Ansible with misleading
    # hostname-resolution errors.
    - name: Install NixOS
      ansible.builtin.command:
        cmd: nixos-install --root /mnt --no-root-passwd
      environment:
        HOME: /root

    - name: Flush writes to disk
      ansible.builtin.command:
        cmd: sync

    - name: Stop VM
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ template_vm_id }}"
        state: stopped
        force: true
        timeout: 60
      delegate_to: localhost

    - name: Remove installation media
      community.proxmox.proxmox_disk:
        vmid: "{{ template_vm_id }}"
        disk: ide2
        media: cdrom
        iso_image: none
        state: present
      delegate_to: localhost

    - name: Boot installed system
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ template_vm_id }}"
        state: started
      delegate_to: localhost

- name: Connect to the installed system
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars.yaml

  tasks:
    - name: Forget installer SSH host key
      ansible.builtin.known_hosts:
        name: "{{ template_ip }}"
        state: absent

    - name: Wait for installed system SSH
      ansible.builtin.wait_for:
        host: "{{ template_ip }}"
        port: 22
        delay: 5
        timeout: 300

    - name: Add installed system to Ansible inventory
      ansible.builtin.add_host:
        name: nixos-template
        groups: new_template
        ansible_host: "{{ template_ip }}"
        ansible_user: admin
        ansible_ssh_private_key_file: "{{ lookup('env', 'NIXOS_DEPLOYMENT_PRIVATE_KEY') }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

- name: Verify the installed system and convert it to a template
  hosts: new_template
  gather_facts: false
  vars_files:
    - ../vars.yaml

  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
      validate_certs: "{{ proxmox_validate_certs }}"

  tasks:
    # Only the installed system has the admin user with the deployment key,
    # so logging in proves the VM booted from disk and not the installer ISO.
    - name: Log in to installed system as admin
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Read NixOS version
      ansible.builtin.command:
        cmd: nixos-version
      register: nixos_version
      changed_when: false

    - name: Show NixOS version
      ansible.builtin.debug:
        msg: "Installed system is up: NixOS {{ nixos_version.stdout }}"

    - name: Shut down VM
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ template_vm_id }}"
        state: stopped
        force: true
        timeout: 120
      delegate_to: localhost

    - name: Convert VM to template
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ template_vm_id }}"
        state: template
      delegate_to: localhost
